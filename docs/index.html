<title>Open Yard Inventory</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002060">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yard Stock">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
:root{
  /* RSA brand core */
  --rsa-blue:#002060; --rsa-blue-700:#001A4F; --rsa-blue-400:#2A4E93; --rsa-blue-tint:#E7ECF6;
  --rsa-red:#C8102E;  --rsa-red-700:#9E0C24; --rsa-red-tint:#FDECEF;
  --good:#84BD00;     --good-ink:#4E7300;    --good-tint:#F1F8DE;
  --sea:#007680;      --sea-tint:#E1F0F1;
  --label:#6B6B6B;

  --bg:#F5F7FA; --card:#FFFFFF; --border:#D0D8E8; --border-strong:#A9B7D0;
  --ink:#16202E; --muted:#5B6472; --disabled-bg:#E8ECF3; --disabled-ink:#98A2B3;

  --sh-1:0 1px 3px rgba(0,32,96,.08);
  --sh-2:0 2px 10px rgba(0,32,96,.10);
  --sh-3:0 -4px 20px rgba(0,32,96,.14);

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:32px; --s-8:40px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;

  --fs-hero:34px; --fs-xl:26px; --fs-lg:20px; --fs-md:17px; --fs-base:16px; --fs-sm:14px; --fs-xs:12px;
  --fw-6:600; --fw-8:800;

  --tap-min:48px; --tap-lg:56px; --tap-xl:64px;
  --nav-h:64px; --header-h:56px; --safe-b:env(safe-area-inset-bottom,0px);
  --z-nav:40; --z-header:30; --z-sheet:100; --z-toast:300; --z-boot:400;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:var(--fs-base);line-height:1.5;-webkit-text-size-adjust:100%}
/* Every input at 16px or iOS Safari force-zooms the page on focus. */
input,select,textarea,button{font:inherit;font-size:var(--fs-base);color:inherit}
button{background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-weight:var(--fw-8)}
.eyebrow{font-size:var(--fs-xs);font-weight:var(--fw-8);letter-spacing:.08em;
  text-transform:uppercase;color:var(--label)}
.req{color:var(--rsa-red)}
:focus-visible{outline:3px solid var(--rsa-blue-400);outline-offset:2px}
/* Author styles beat the browser's own [hidden]{display:none}, so a rule like
   .boot{display:flex} silently defeats el.hidden and the splash screen never
   goes away. This one line is what makes every `hidden` in the markup work. */
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;height:var(--header-h);background:var(--rsa-blue);color:#fff;
  display:flex;align-items:center;gap:var(--s-2);padding:0 var(--s-3);z-index:var(--z-header)}
.hdr-title{font-size:var(--fs-md);font-weight:var(--fw-8);letter-spacing:.04em;
  text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-sync{min-height:44px;padding:0 var(--s-3);border-radius:var(--r-pill);font-size:var(--fs-xs);
  font-weight:var(--fw-8);display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:rgba(255,255,255,.16);color:#fff}
.pill-sync .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 auto}
.pill-sync.is-syncing{background:var(--sea-tint);color:var(--sea)}
.pill-sync.is-syncing .dot{background:var(--sea);animation:pulse 1.2s infinite}
.pill-sync.is-offline-pending{background:#fff;color:var(--rsa-red)}
.pill-sync.is-offline-pending .dot{background:var(--rsa-red)}
.pill-sync.is-offline .dot{background:var(--label)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chip-user{min-height:44px;padding:0 var(--s-2) 0 2px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.16);color:#fff;font-size:var(--fs-sm);font-weight:var(--fw-8);
  display:flex;align-items:center;gap:var(--s-2);max-width:120px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:var(--fw-8);font-size:var(--fs-sm);color:#fff;flex:0 0 auto}
.chip-user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- layout ---------- */
.screen{display:none;padding:var(--s-4);padding-bottom:calc(var(--nav-h) + var(--safe-b) + var(--s-7));
  max-width:640px;margin:0 auto}
.screen.active{display:block}
.banner{border-radius:var(--r-md);padding:var(--s-3);font-size:var(--fs-sm);margin-bottom:var(--s-3);
  display:flex;gap:var(--s-2);align-items:center}
.banner-err{background:var(--rsa-red-tint);color:var(--rsa-red);border-left:4px solid var(--rsa-red);
  font-weight:var(--fw-6);width:100%;text-align:left}
.banner-info{background:var(--sea-tint);color:var(--sea);border-left:4px solid var(--sea)}

/* ---------- buttons ---------- */
.btn{width:100%;min-height:var(--tap-lg);padding:0 var(--s-5);border-radius:var(--r-md);
  background:var(--rsa-blue);color:#fff;font-size:var(--fs-md);font-weight:var(--fw-8);
  display:flex;align-items:center;justify-content:center;gap:var(--s-2);transition:transform .12s ease}
.btn:active{background:var(--rsa-blue-700);transform:scale(.985)}
.btn:disabled{background:var(--disabled-bg);color:var(--disabled-ink);transform:none}
.btn-ghost{background:transparent;border:2px solid var(--border-strong);color:var(--rsa-blue)}
.btn-ghost:active{background:var(--rsa-blue-tint)}
.btn-danger{background:var(--rsa-red)}
.btn-danger:active{background:var(--rsa-red-700)}
.btn-row{display:flex;gap:var(--s-2)}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- fields ---------- */
.field{margin-bottom:var(--s-4)}
.field-label{display:block;margin-bottom:var(--s-2)}
.field-input{width:100%;height:var(--tap-lg);padding:0 var(--s-4);border:2px solid var(--border-strong);
  border-radius:var(--r-md);background:var(--card);-webkit-appearance:none}
textarea.field-input{height:auto;min-height:var(--tap-lg);padding:var(--s-3) var(--s-4);resize:none}
.field-input:focus{border-color:var(--rsa-blue);box-shadow:0 0 0 3px var(--rsa-blue-tint);outline:none}
.field-input.is-invalid{border-color:var(--rsa-red);background:var(--rsa-red-tint)}
.field-input:disabled,.field-input[readonly]{background:var(--disabled-bg);color:var(--muted)}
.field-error{font-size:var(--fs-sm);color:var(--rsa-red);margin-top:var(--s-2);min-height:20px;
  font-weight:var(--fw-6)}
/* Reserve the space only when there is a message; an empty one left a dead gap. */
.field-error:empty{min-height:0;margin-top:0}
.field-help{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s-2)}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:var(--s-2);height:var(--tap-xl)}
.stepper button{width:var(--tap-xl);height:var(--tap-xl);border-radius:var(--r-md);
  background:var(--rsa-blue-tint);color:var(--rsa-blue);font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepper button:disabled{background:var(--disabled-bg);color:var(--disabled-ink)}
.stepper input{flex:1;min-width:0;text-align:center;font-size:var(--fs-lg);font-weight:var(--fw-8);
  border:2px solid var(--border-strong);border-radius:var(--r-md);background:var(--card);
  font-variant-numeric:tabular-nums;-webkit-appearance:none}
.stepper input:focus{border-color:var(--rsa-blue);box-shadow:0 0 0 3px var(--rsa-blue-tint);outline:none}
.stepper input.is-invalid{border-color:var(--rsa-red);background:var(--rsa-red-tint)}
.chips{display:flex;gap:var(--s-2);margin-top:var(--s-2);flex-wrap:wrap}
.chip-add{min-height:var(--tap-min);padding:0 var(--s-4);border-radius:var(--r-pill);
  background:var(--card);border:2px solid var(--border);color:var(--rsa-blue);
  font-size:var(--fs-sm);font-weight:var(--fw-8);display:flex;align-items:center}
.chip-add:active{background:var(--rsa-blue-tint)}

/* ---------- chips / bars ---------- */
.chip{height:32px;padding:0 var(--s-3);border-radius:var(--r-pill);font-size:var(--fs-sm);
  font-weight:var(--fw-8);display:inline-flex;align-items:center;gap:6px}
.chip-good{background:var(--good-tint);color:var(--good-ink)}
.chip-dmg{background:var(--rsa-red-tint);color:var(--rsa-red)}
.chip-neutral{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.stockbar{height:10px;border-radius:var(--r-pill);background:var(--good);overflow:hidden;display:flex;
  justify-content:flex-end;margin-top:var(--s-2)}
.stockbar .dmg{background:var(--rsa-red);transition:width .25s ease}
.stockbar.empty{background:var(--disabled-bg)}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap-xl);
  padding:var(--s-3) var(--s-4);background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);box-shadow:var(--sh-1);margin-bottom:var(--s-2);width:100%;text-align:left}
.row:active{background:var(--rsa-blue-tint)}
.row-main{flex:1;min-width:0}
.row-sku{display:block;font-size:var(--fs-md);font-weight:var(--fw-8);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row-desc{display:block;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row-num{text-align:right;flex:0 0 auto}
.row-num .v{font-size:var(--fs-xl);font-weight:var(--fw-8);font-variant-numeric:tabular-nums;
  line-height:1.1}
.chev{color:var(--border-strong);font-size:20px;flex:0 0 auto}
.bal-row{flex-direction:column;align-items:stretch;gap:var(--s-1)}
.bal-top{display:flex;align-items:flex-start;gap:var(--s-3)}
.bal-chips{display:flex;gap:var(--s-2);padding-left:var(--s-4);flex-wrap:wrap}
.bal-row.has-dmg{border-left:3px solid var(--rsa-red)}
.bal-row.all-good{border-left:3px solid var(--good)}

/* ---------- cards ---------- */
.summary{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--rsa-blue);
  border-radius:var(--r-lg);padding:var(--s-4);box-shadow:var(--sh-1);margin-bottom:var(--s-4)}
.summary .big{font-size:var(--fs-hero);font-weight:var(--fw-8);font-variant-numeric:tabular-nums;
  line-height:1.1}
.summary-chips{display:flex;gap:var(--s-2);margin-top:var(--s-2);flex-wrap:wrap}
.ctx-strip{background:var(--rsa-blue-tint);border-radius:var(--r-md);padding:var(--s-3);
  font-size:var(--fs-sm);color:var(--rsa-blue);margin-bottom:var(--s-4);font-weight:var(--fw-6)}
.avail{background:var(--good-tint);border:1px solid #CDE39A;border-radius:var(--r-lg);
  padding:var(--s-4);text-align:center;margin-bottom:var(--s-4)}
.avail.zero{background:var(--rsa-red-tint);border-color:#F3B8C1}
.avail .v{font-size:var(--fs-hero);font-weight:var(--fw-8);color:var(--good-ink);
  font-variant-numeric:tabular-nums;line-height:1.1}
.avail.zero .v{color:var(--rsa-red)}
.avail .sub{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--s-2)}
.preview{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--s-3);margin-bottom:var(--s-4);font-size:var(--fs-sm)}
.preview .line{display:flex;justify-content:space-between;gap:var(--s-2);margin-bottom:var(--s-1)}
.preview b{font-weight:var(--fw-8)}
.note-info{background:var(--rsa-blue-tint);border-left:4px solid var(--rsa-blue);
  border-radius:var(--r-md);padding:var(--s-3);font-size:var(--fs-sm);color:var(--rsa-blue);
  margin-bottom:var(--s-4)}
.note-info b{font-weight:var(--fw-8)}
.equation{display:flex;align-items:flex-end;justify-content:center;gap:var(--s-3);
  padding:var(--s-4) 0;text-align:center}
.equation .term{flex:0 1 auto}
.equation .term .v{font-size:var(--fs-hero);font-weight:var(--fw-8);font-variant-numeric:tabular-nums;
  line-height:1.05}
.equation .op{font-size:var(--fs-lg);color:var(--muted);padding-bottom:22px;font-weight:var(--fw-6)}

/* ---------- item select trigger ---------- */
.item-select{width:100%;min-height:var(--tap-lg);padding:var(--s-3) var(--s-4);
  border:2px solid var(--border-strong);border-radius:var(--r-md);background:var(--card);
  display:flex;align-items:center;gap:var(--s-3);text-align:left}
.item-select.is-invalid{border-color:var(--rsa-red);background:var(--rsa-red-tint)}
.item-select .placeholder{color:var(--muted)}
.item-select .chg{color:var(--rsa-blue);font-weight:var(--fw-8);font-size:var(--fs-sm);flex:0 0 auto}

/* ---------- search ---------- */
.search{position:relative;margin-bottom:var(--s-3)}
.search input{width:100%;height:var(--tap-lg);padding:0 var(--tap-min) 0 44px;
  border:2px solid var(--border-strong);border-radius:var(--r-md);background:var(--card);
  -webkit-appearance:none}
.search input:focus{border-color:var(--rsa-blue);outline:none}
.search .ico{position:absolute;left:var(--s-3);top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;color:var(--muted);font-size:20px}
.sorts{display:flex;gap:var(--s-2);overflow-x:auto;padding-bottom:var(--s-2);margin-bottom:var(--s-3);
  scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.chip-filter{min-height:var(--tap-min);padding:0 var(--s-4);border-radius:var(--r-pill);
  background:var(--card);border:2px solid var(--border);color:var(--muted);
  font-size:var(--fs-sm);font-weight:var(--fw-8);white-space:nowrap;display:flex;align-items:center}
.chip-filter[aria-pressed="true"]{background:var(--rsa-blue);border-color:var(--rsa-blue);color:#fff}
/* The warehouse chip row. Same metrics as .sorts on purpose — both are
   horizontally scrolling filter rows and both must clear the 44px tap target
   the layout checker enforces. */
.facbar{display:flex;gap:var(--s-2);overflow-x:auto;padding-bottom:var(--s-2);
  margin-bottom:var(--s-3);scrollbar-width:none}
.facbar::-webkit-scrollbar{display:none}
.chip-filter.is-closed{border-style:dashed;color:var(--label)}
.chip-filter.is-closed[aria-pressed="true"]{background:var(--label);border-color:var(--label)}
/* The yard name on a balance row / movement line. Never omitted when more than
   one yard is in play: two yards holding one item are otherwise two identical
   unlabelled rows. */
.yard-tag{font-size:var(--fs-xs);font-weight:var(--fw-8);letter-spacing:.04em;
  color:var(--sea);background:var(--sea-tint);padding:2px 8px;border-radius:var(--r-pill);
  white-space:nowrap}
.fac-note{font-size:var(--fs-sm);font-weight:var(--fw-8);color:var(--rsa-blue);
  background:var(--rsa-blue-tint);border-radius:var(--r-md);padding:var(--s-3);
  margin-bottom:var(--s-4);display:flex;align-items:center;gap:var(--s-2)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--border);
  box-shadow:var(--sh-3);display:flex;z-index:var(--z-nav)}
.tab{flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--muted);font-size:var(--fs-xs);
  font-weight:var(--fw-8);letter-spacing:.04em;position:relative;text-transform:uppercase}
.tab .g{font-size:20px;line-height:1}
.tab[aria-current="page"]{color:var(--rsa-blue)}
.tab[aria-current="page"]::before{content:'';position:absolute;top:0;left:12%;right:12%;height:3px;
  background:var(--rsa-blue);border-radius:0 0 3px 3px}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(22,32,46,.5);display:none;align-items:flex-end;
  z-index:var(--z-sheet)}
.backdrop.open{display:flex}
.sheet{background:var(--card);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;
  max-height:92vh;box-shadow:var(--sh-3);display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hdr{height:var(--header-h);display:flex;align-items:center;gap:var(--s-2);
  padding:0 var(--s-3);border-bottom:1px solid var(--border);flex:0 0 auto}
.sheet-hdr h2{flex:1;font-size:var(--fs-md);font-weight:var(--fw-8);text-transform:uppercase;
  letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-x{width:44px;height:44px;font-size:24px;color:var(--muted);flex:0 0 auto}
.sheet-body{padding:var(--s-4);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:var(--s-4);border-top:1px solid var(--border);flex:0 0 auto}
.picker-search{padding:var(--s-3) var(--s-4) 0;flex:0 0 auto}

/* ---------- misc ---------- */
.empty{text-align:center;padding:var(--s-8) var(--s-5)}
.empty .g{font-size:48px;display:block;margin-bottom:var(--s-3)}
.empty h3{font-size:var(--fs-md);font-weight:var(--fw-8);margin-bottom:var(--s-2)}
.empty p{font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--s-4)}
.skel{background:linear-gradient(90deg,#E9EDF4 25%,#F5F7FA 37%,#E9EDF4 63%);background-size:400% 100%;
  animation:shim 1.3s infinite;border-radius:var(--r-md);height:var(--tap-xl);margin-bottom:var(--s-2)}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + var(--safe-b) + var(--s-4));max-width:calc(100% - var(--s-8));
  padding:var(--s-3) var(--s-5);border-radius:var(--r-pill);font-size:var(--fs-sm);
  font-weight:var(--fw-6);color:#fff;z-index:var(--z-toast);box-shadow:var(--sh-2);display:none;
  text-align:center}
.toast.show{display:block}
.toast.success{background:var(--good-ink)}
.toast.error{background:var(--rsa-red)}
.toast.info{background:var(--sea)}
.toast.warn{background:#8A5A00}
.boot{position:fixed;inset:0;z-index:var(--z-boot);
  background:linear-gradient(160deg,var(--rsa-blue) 0%,var(--rsa-blue-700) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-4);
  color:#fff;padding:var(--s-6);text-align:center}
.wordmark{font-size:var(--fs-hero);font-weight:var(--fw-8);letter-spacing:.14em;line-height:1.1}
.wordmark .r{color:#fff}
.wordmark .l{color:#FF6B80}
.wordmark-sub{font-size:13px;letter-spacing:.18em;opacity:.75;margin-top:6px}
.boot .spin{width:36px;height:36px;border-width:3px}
.fab{position:fixed;right:var(--s-4);bottom:calc(var(--nav-h) + var(--safe-b) + var(--s-4));
  width:var(--tap-lg);height:var(--tap-lg);border-radius:50%;background:var(--rsa-blue);color:#fff;
  font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,32,96,.4);z-index:var(--z-nav)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.tile{min-height:var(--tap-lg);border:2px solid var(--border-strong);border-radius:var(--r-md);
  background:var(--card);display:flex;align-items:center;justify-content:center;text-align:center;
  padding:var(--s-2);font-size:var(--fs-base)}
.tile[aria-pressed="true"]{border-color:var(--rsa-red);background:var(--rsa-red-tint);
  color:var(--rsa-red);font-weight:var(--fw-8)}
.mv{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) 0;
  border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.mv:last-child{border-bottom:none}
.mv .t{flex:1;min-width:0}
.mv .q{font-weight:var(--fw-8);font-variant-numeric:tabular-nums}

<script type="module">
import { configure, apiPost, ApiError, probe } from './lib/api.js';
import { prefs, cacheMeta } from './lib/idb.js';
import { normSku, normFacility } from './lib/deltas.js';
import * as OB from './lib/outbox.js';
import * as SY from './lib/sync.js';

/* ================= configuration ================= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_s3R6Kn2YaLNFM4CmuP9QZCTNiqcdBOonFrigrAdOFhV4XNHrMIRWlApTtzS2fMYn/exec';
window.OY_APP_VERSION = '1.0.2';
configure(SCRIPT_URL);

const $ = id => document.getElementById(id);
const AVATAR_COLOURS = ['#002060','#007680','#3C1053','#0A5A8C','#4E7300','#8A5A00'];
const REASONS = ['Rain / water','Handling damage','Rust / corrosion','Bent / broken','Torn packing','Other'];

const ui = {
  screen: 'balance',
  balSearch: '', balSort: prefs.getSort(),
  itemSearch: '',
  rcvSku: null, issSku: null,
  // The warehouse each ENTRY screen is recording against. Required (5.A) and
  // never pre-filled (6.B): entering Receive or Issue from the tab bar clears
  // it, so nobody records a truck against whichever yard they happened to be
  // looking at earlier. It is only carried in when the action was STARTED from
  // a yard-specific place, which is the exception 10.A asks for.
  rcvFacility: '', issFacility: '',
  pickerTarget: null,
  usersLoaded: false,      // distinguishes "no names" from "not loaded yet"
  sheetStack: []
};

/**
 * The warehouse the STOCK SCREEN is showing. `''` is the "All warehouses" view.
 *
 * Set by the chip row above the stock list, and by nothing else. It is the
 * screen's filter, NOT an ambient "current yard" that other screens read: an
 * entry screen reads its OWN `ui.rcvFacility` / `ui.issFacility`, and every
 * sheet takes the yard as an explicit argument.
 *
 * That distinction is the whole of finding F10. If actions read a global that
 * the stock screen also writes, then "All warehouses" — which has no single
 * yard — silently gates an Issue on the ACROSS-YARD total, and the app happily
 * lets someone issue 300 from a yard holding 40 because the other yard holds
 * 260. The All view therefore offers no actions at all; it makes you pick a
 * yard first, and the yard you picked is passed down by hand from there.
 */
let uiFacility = '';

/* ================= warehouses ================= */

/** The yards a new entry may be recorded against. Closed ones are not offered. */
function activeFacilities() {
  return SY.state.facilities.filter(f => f.active !== false);
}

/** True when this yard exists but has been closed. Movements to it still post. */
function isClosedFacility(name) {
  const f = SY.facilityByName(name);
  return !!f && f.active === false;
}

/**
 * The yard name if the server would recognise it, otherwise `''`.
 *
 * A CLOSED yard passes — 11.A accepts a movement at one and flags it. What this
 * rejects is a name that is not in the warehouse list at all, which is not
 * hypothetical: a balance row names its yard, the warehouse list is a separate
 * read, and the Sheet is hand-editable on an ANYONE_ANONYMOUS deployment, so a
 * yard deleted by hand leaves stock rows pointing at a warehouse that no longer
 * exists. Without this the app paints the full action set for that yard, every
 * `!facility` guard passes because the string is truthy, and the entry is
 * enqueued — only for the server to answer UNKNOWN_FACILITY, non-retryable. A
 * real physical movement then sits in the failures list carrying a message a
 * yard worker has no way to act on.
 *
 * Checked at the point of ACTION, not only at paint: the warehouse list is
 * refreshed in the background while a form is open.
 */
function knownFacility(name) {
  const fac = normFacility(name);
  return fac && SY.facilityByName(fac) ? fac : '';
}

/**
 * Set the warehouse the stock screen is filtered to.
 *
 * A yard that disappears from the list (closed by a supervisor on another
 * phone, or a cache restored from a build that had different yards) must not
 * leave the screen stuck on a filter that matches nothing, so an unknown name
 * falls back to All.
 */
function setUiFacility(name) {
  const fac = normFacility(name);
  uiFacility = fac && SY.facilityByName(fac) ? fac : '';
  return uiFacility;
}

/**
 * The warehouse picker. Same sheet, same search box and the same row metrics as
 * the item picker — a yard worker should not have to learn two list controls.
 *
 * @param {{title?:string, current?:string, exclude?:string, allow?:string[],
 *           onPick:function}} o
 *   `exclude` drops one yard from the list; `allow`, when given, is the set of
 *   yards the caller can actually act on (the `current` one always survives).
 *
 * It does NOT close the sheet before calling `onPick` — that is the caller's
 * job, and getting it wrong is a bug that has shipped here before. There is
 * only ever ONE sheet: opening this picker REPLACES whatever sheet was on
 * screen, so a caller that is itself a sheet must re-open itself from `onPick`
 * rather than expect to still be there. And a caller that is a SCREEN must
 * close, because nothing else will. `closeSheet()` immediately followed by
 * `openSheet()` is the specific thing to avoid: close runs `history.back()`,
 * open pushes a state, and the two race — which is exactly how "Change name"
 * was silently broken and why scripts/verify-flows.mjs exists.
 */
async function openFacilityPicker(o) {
  const exclude = normFacility(o.exclude || '');
  const current = normFacility(o.current || '');
  openSheet({
    title: o.title || 'Choose warehouse',
    search: `<div class="search" style="margin-bottom:var(--s-3)">
        <span class="ico">🔍</span>
        <input id="fpSearch" type="search" inputmode="search" autocomplete="off" spellcheck="false"
          autocapitalize="characters" placeholder="Search warehouse">
      </div>`,
    body: '<div id="fpList"></div>'
  });

  const paint = async () => {
    const q = ($('fpSearch')?.value || '').trim().toUpperCase();
    const bals = await SY.projected();
    // A yard that has been CLOSED is normally not offered. The one exception is
    // the yard already selected on this form: hiding it would make the screen
    // show a warehouse the picker then denies exists, and 11.A is explicit that
    // a movement at a closed yard is accepted rather than refused.
    const list = SY.state.facilities.filter(f =>
      f.facility !== exclude &&
      // `allow`, when given, is the set of yards the CALLER can actually act
      // on. The damage sheet passes the yards holding good stock of this item:
      // offering one that holds none replaces the sheet with a form whose limit
      // is zero and whose submit can never enable — and the sheet it replaced
      // is gone, because there is only ever one.
      // `|| f.facility === current` on BOTH filters. Without it on `allow`,
      // the yard this form is already set to can be filtered out of its own
      // picker — the ✓ row simply absent — which is the stranding this option
      // exists to prevent, reappearing one level down.
      (!o.allow || o.allow.includes(f.facility) || f.facility === current) &&
      (f.active !== false || f.facility === current) &&
      (!q || f.facility.includes(q) || String(f.description || '').toUpperCase().includes(q)));

    const rows = list.map(f => {
      // How much is standing at this yard, across every item. Choosing a yard
      // blind is how stock gets recorded in the wrong place.
      const here = bals.filter(b => b.facility === f.facility);
      const tot = here.reduce((s, b) => s + b.total, 0);
      const closed = f.active === false;
      return `<button class="row" data-fac="${esc(f.facility)}">
        <span class="row-main">
          <span class="row-sku">${esc(f.facility)}${f.facility === current ? ' ✓' : ''}</span>
          <span class="row-desc">${esc(f.description || '')}${closed ? ' · closed' : ''}</span>
        </span>
        <span class="row-num"><span class="v" style="font-size:var(--fs-md)">${n(tot)}</span>
          <span class="eyebrow" style="display:block">in yard</span></span>
      </button>`;
    }).join('');

    $('fpList').innerHTML = list.length ? rows : (
      SY.state.facilities.length
        ? `<div class="empty"><span class="g">🔍</span>
             <h3>No warehouse matches “${esc(q)}”</h3></div>`
        : `<div class="empty"><span class="g">🏗</span>
             <h3>No warehouses yet</h3>
             <p>Stock has to live somewhere. Add your first warehouse before recording anything.</p>
             <button class="btn" id="fpAdd">+ Add a warehouse</button></div>`);

    for (const b of $('fpList').querySelectorAll('[data-fac]')) {
      b.onclick = () => o.onPick(b.dataset.fac);
    }
    if ($('fpAdd')) $('fpAdd').onclick = () => openFacilityForm(null);
  };
  $('fpSearch').oninput = debounce(paint, 150);
  await paint();
}

/**
 * One item's stock summed across EVERY warehouse.
 *
 * Read-only by contract. Nothing that changes stock may be gated on this — see
 * the note on `uiFacility`. It exists for the All view's headline figure and
 * for the per-yard breakdown that view offers instead of buttons.
 */
async function aggregateFor(sku) {
  const key = normSku(sku);
  const rows = (await SY.projected()).filter(r => r.sku === key);
  const agg = { sku: key, total: 0, damaged: 0, good: 0, pending: 0, lastTxnTs: '', at: [] };
  for (const r of rows) {
    agg.total += r.total;
    agg.damaged += r.damaged;
    agg.good += r.good;
    agg.pending += r.pending || 0;
    if (String(r.lastTxnTs) > agg.lastTxnTs) agg.lastTxnTs = String(r.lastTxnTs || '');
    agg.at.push(r);
  }
  agg.at.sort((a, b) => b.total - a.total || (a.facility < b.facility ? -1 : 1));
  return agg;
}

/* ================= small helpers ================= */
const n = v => new Intl.NumberFormat('en-US').format(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function avatarColour(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return AVATAR_COLOURS[h % AVATAR_COLOURS.length];
}

let toastTimer = null;
function toast(msg, kind = 'success') {
  const el = $('toast');
  el.textContent = msg;
  el.className = `toast show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'error' ? 4500 : 2600);
}

function buzz(ms = 40) { try { navigator.vibrate?.(ms); } catch {} }

function stockBar(total, damaged) {
  if (!total) return '<div class="stockbar empty"></div>';
  const pct = Math.max(0, Math.min(100, (damaged / total) * 100));
  return `<div class="stockbar"><div class="dmg" style="width:${pct}%"></div></div>`;
}

function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return `Today ${t}`;
  const y = new Date(today); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `Yest ${t}`;
  return `${d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })} ${t}`;
}

/* ================= sheets ================= */
function openSheet({ title, body, foot, search }) {
  // Only the FIRST open pushes history. Opening a sheet while one is already
  // open replaces its contents, so there is nothing extra to pop and no back
  // step to race against.
  const wasOpen = $('sheetBackdrop').classList.contains('open');
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = body;
  const f = $('sheetFoot');
  if (foot) { f.innerHTML = foot; f.hidden = false; } else { f.hidden = true; f.innerHTML = ''; }
  const s = $('sheetSearchSlot');
  if (search) { s.innerHTML = search; s.hidden = false; } else { s.hidden = true; s.innerHTML = ''; }
  $('sheetBackdrop').classList.add('open');
  if (!wasOpen) history.pushState({ sheet: true }, '');
}

function closeSheet(fromPop) {
  if (!$('sheetBackdrop').classList.contains('open')) return;
  $('sheetBackdrop').classList.remove('open');
  $('sheetBody').innerHTML = '';
  $('sheetFoot').innerHTML = '';
  $('sheetSearchSlot').innerHTML = '';
  if (!fromPop && history.state && history.state.sheet) history.back();
}

$('sheetClose').onclick = () => closeSheet();
$('sheetBackdrop').onclick = e => { if (e.target === $('sheetBackdrop')) closeSheet(); };
window.addEventListener('popstate', () => {
  if ($('sheetBackdrop').classList.contains('open')) closeSheet(true);
});

function confirmSheet({ title, message, confirmLabel, danger, onConfirm }) {
  openSheet({
    title,
    body: `<p style="font-size:var(--fs-base);line-height:1.55">${message}</p>`,
    foot: `<div class="btn-row">
        <button class="btn btn-ghost" id="cfNo">Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : ''}" id="cfYes">${esc(confirmLabel)}</button>
      </div>`
  });
  $('cfNo').onclick = () => closeSheet();
  $('cfYes').onclick = async () => { closeSheet(); await onConfirm(); };
}

/* ================= sync pill ================= */
async function renderSync() {
  const { pending, failed } = await OB.counts();
  const online = SY.state.online;
  const pill = $('syncPill');
  const txt = $('syncText');

  pill.className = 'pill-sync';
  if (!online && pending > 0) {
    pill.classList.add('is-offline-pending');
    txt.textContent = `Offline · ${pending} pending`;
  } else if (!online) {
    pill.classList.add('is-offline');
    txt.textContent = 'Offline';
  } else if (pending > 0) {
    pill.classList.add('is-syncing');
    txt.textContent = OB.isFlushing() ? `Syncing ${pending}` : `${pending} pending`;
  } else {
    txt.textContent = 'Online';
  }

  const banner = $('failBanner');
  if (failed > 0) {
    banner.hidden = false;
    banner.innerHTML = `⚠ ${failed} ${failed === 1 ? 'entry' : 'entries'} could not be saved — tap to fix`;
  } else {
    banner.hidden = true;
  }

  const stale = $('staleBanner');
  if (pending > 0 && SY.state.lastSyncTs) {
    stale.hidden = false;
    stale.textContent = `Showing stock as of ${when(SY.state.lastSyncTs)}. ${pending} not uploaded yet.`;
  } else {
    stale.hidden = true;
  }
}

/* ================= navigation ================= */
const TITLES = { balance:'Balance', receive:'Receive', issue:'Issue', items:'Items', name:'' };

/**
 * @param {string} screen
 * @param {string} [facility]  the yard to carry ONTO an entry screen (10.A)
 *
 * Navigating to Receive or Issue CLEARS the chosen warehouse unless the caller
 * names one. Clearing by default, here, rather than at each navigation site, is
 * deliberate and was a bug first: the version that cleared only in the tab-bar
 * handler left `show('receive')` from the stock screen's own "Receive stock"
 * empty-state button carrying the yard from whatever action was taken last. On
 * a yard the app had just described as empty, the form opened pre-filled with a
 * DIFFERENT yard, one tap from filing a receipt against it.
 *
 * So: a route that should carry a yard must say so (`show('receive', fac)`);
 * every other route gets 6.B's fresh ask for free, including routes nobody has
 * written yet.
 */
function show(screen, facility) {
  if (screen === 'receive') ui.rcvFacility = normFacility(facility || '');
  if (screen === 'issue') ui.issFacility = normFacility(facility || '');
  ui.screen = screen;
  for (const el of document.querySelectorAll('.screen')) el.classList.remove('active');
  $(`scr-${screen}`).classList.add('active');
  const isName = screen === 'name';
  $('hdr').hidden = isName;
  $('tabbar').hidden = isName;
  $('hdrTitle').textContent = TITLES[screen] || '';
  for (const t of document.querySelectorAll('.tab')) {
    if (t.dataset.screen === screen) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  }
  window.scrollTo(0, 0);
  render();
}

for (const t of document.querySelectorAll('.tab')) {
  // No facility argument, so `show` clears it — 6.B. The item is deliberately
  // NOT cleared: several trucks of the same SKU arrive in a row, and that
  // convenience costs nothing because the item is named on screen in large
  // type, while a yard once chosen is easy to stop reading.
  t.onclick = () => show(t.dataset.screen);
}

/* ================= render dispatcher ================= */
async function render() {
  await renderSync();
  if (ui.screen === 'balance') await renderBalance();
  else if (ui.screen === 'items') renderItems();
  else if (ui.screen === 'receive') await renderReceive();
  else if (ui.screen === 'issue') await renderIssue();
  else if (ui.screen === 'name') renderNames();
}

/**
 * Take the upload attempt an enqueue kicked off, merge the balances it replies
 * with, and repaint.
 *
 * NEVER awaited by a submit handler. The upload is deliberately off the
 * critical path (docs/lib/outbox.js header); awaiting it here would put the
 * round trip back in front of the user, which is the one thing the outbox
 * exists to prevent.
 *
 * Why it exists: on success the flush deletes the entry from the queue, so if
 * these balances are dropped the screen falls back to the PRE-write server
 * figure and the number visibly jumps BACKWARDS a second after saving. It looks
 * exactly like the app losing the entry, and it is what it used to do.
 */
function settleInBackground(settled) {
  settled.then(async s => {
    if (s && s.balances && s.balances.length) await SY.mergeBalances(s.balances);
    await render();
  }).catch(() => { /* the entry stays queued; backoff retries it */ });
}

/**
 * Debounce, for handlers on the typing path. Without it every character
 * re-projects every balance.
 */
function debounce(fn, ms) {
  let t = null;
  return (...args) => {
    if (t) clearTimeout(t);
    t = setTimeout(() => { t = null; fn(...args); }, ms);
  };
}

$('btnSaveUser').onclick = async () => {
  const name = $('newUserName').value.trim();
  const err = $('newUserErr');
  if (!name) return void (err.textContent = 'Enter your name.');
  if (name.length < 2) return void (err.textContent = 'Name must be at least 2 characters.');
  if (SY.state.users.some(u => u.toLowerCase() === name.toLowerCase())) {
    return void (err.textContent = 'That name is already in the list — tap it above.');
  }
  err.textContent = '';
  SY.state.users = [...SY.state.users, name].sort();

  // Go straight in. This used to await the POST before moving, which meant up
  // to 20 seconds (api.js API_TIMEOUT_MS) on a dead-looking screen when signal
  // was weak — and the only thing the wait bought was choosing which toast to
  // show, since BOTH branches then called pickUser anyway. The name works on
  // this phone the moment it is typed; the server learning it is not something
  // anybody needs to stand in the yard waiting for.
  pickUser(name);
  apiPost('addUser', { name }).catch(() => {
    // Until the server has the name it will reject entries recorded under it,
    // so this has to be said plainly rather than swallowed.
    toast('Saved on this phone. Connect once to finish adding your name.', 'warn');
  });
};

/* ================= manage warehouses ================= */

/**
 * Add and edit warehouses. There is NO delete and NO rename, and the UI must
 * say so at creation rather than at the point someone tries (9.A): every ledger
 * row and every balance is keyed on the NAME, so a rename orphans the history
 * and a delete leaves stock with nowhere to live. A yard that closes is marked
 * inactive — it drops out of the pickers while its stock and history stay put.
 *
 * Online only. There is no offline queue for master data: a yard invented on a
 * phone that never uploads would let entries be recorded against a warehouse
 * the server will refuse, and those entries are real movements.
 */
function openFacilitiesSheet() {
  const list = SY.state.facilities;
  openSheet({
    title: 'Warehouses',
    body: list.length ? list.map(f => `
      <button class="row" data-edit-fac="${esc(f.facility)}">
        <span class="row-main">
          <span class="row-sku">${esc(f.facility)}</span>
          <span class="row-desc">${esc(f.description || 'No description')}</span>
        </span>
        <span class="chip ${f.active === false ? 'chip-dmg' : 'chip-good'}">${
          f.active === false ? 'Closed' : 'Open'}</span>
        <span class="chev">›</span>
      </button>`).join('')
      : `<div class="empty"><span class="g">🏗</span><h3>No warehouses yet</h3>
         <p>Add the yards you store stock in. Every entry is recorded against one.</p></div>`,
    foot: `<button class="btn" id="facAdd">+ Add warehouse</button>`
  });
  for (const b of $('sheetBody').querySelectorAll('[data-edit-fac]')) {
    b.onclick = () => openFacilityForm(b.dataset.editFac);
  }
  $('facAdd').onclick = () => openFacilityForm(null);
}

function openFacilityForm(existingName) {
  const f = existingName ? SY.facilityByName(existingName) : null;
  let active = f ? f.active !== false : true;

  openSheet({
    title: f ? 'Edit warehouse' : 'Add warehouse',
    body: `
      <div class="field">
        <label class="field-label eyebrow" for="ffName">Warehouse name <span class="req">*</span></label>
        <input class="field-input" id="ffName" type="text" autocapitalize="characters"
          autocomplete="off" spellcheck="false" maxlength="40" enterkeyhint="next"
          value="${esc(f?.facility || '')}" ${f ? 'readonly' : ''}>
        ${f
          ? '<div class="field-help">The name can’t be changed — every movement ever recorded is filed under it.</div>'
          : `<div class="note-info" style="margin-top:var(--s-2)">
               <b>This name cannot be changed later.</b> Every receipt, issue and move is
               filed under it forever. Type it the way you want it to read.</div>`}
        <div class="field-error" id="ffNameErr"></div>
      </div>
      <div class="field">
        <label class="field-label eyebrow" for="ffDesc">Description (optional)</label>
        <input class="field-input" id="ffDesc" type="text" autocapitalize="sentences"
          maxlength="120" enterkeyhint="done" value="${esc(f?.description || '')}">
        <div class="field-error" id="ffDescErr"></div>
      </div>
      ${f ? `
      <div class="field">
        <span class="field-label eyebrow">Status</span>
        <div class="tiles" id="ffActive">
          <button class="tile" data-active="1" aria-pressed="${String(active)}">Open</button>
          <button class="tile" data-active="0" aria-pressed="${String(!active)}">Closed</button>
        </div>
        <div class="field-help">A closed warehouse stops appearing in the pickers.
          Its stock and its history stay exactly where they are, and an entry already
          waiting to upload is still accepted.</div>
      </div>` : ''}`,
    foot: `<button class="btn" id="ffSave" disabled>${f ? 'Save changes' : 'Add warehouse'}</button>`
  });

  if (f) {
    for (const t of $('ffActive').querySelectorAll('[data-active]')) {
      t.onclick = () => {
        active = t.dataset.active === '1';
        for (const o of $('ffActive').querySelectorAll('[data-active]')) {
          o.setAttribute('aria-pressed', String((o.dataset.active === '1') === active));
        }
      };
    }
  }

  // Kept in step with upsertFacility_ in gas/Ledger.js. '|' is refused
  // separately below so the message can say why — it is the balance-key
  // separator, which is a data rule and not a typography one.
  const NAME_OK = /^[A-Z0-9][A-Z0-9 \-_.\/&(),'+#]{1,39}$/;

  function validate() {
    const name = ($('ffName').value || '').trim().toUpperCase();
    const err = $('ffNameErr');
    err.textContent = '';
    $('ffName').classList.remove('is-invalid');
    let ok = true;
    if (f) { $('ffSave').disabled = false; return; }
    if (!name) ok = false;
    else if (name.includes('|')) {
      err.textContent = 'A warehouse name cannot contain the | character.';
      $('ffName').classList.add('is-invalid'); ok = false;
    } else if (!NAME_OK.test(name)) {
      err.textContent = "Use letters, numbers, spaces and - _ . / & ( ) , ' + # only, "
        + '2 to 40 characters.';
      $('ffName').classList.add('is-invalid'); ok = false;
    } else if (SY.state.facilities.some(x => x.facility === name)) {
      err.textContent = `${name} already exists.`;
      $('ffName').classList.add('is-invalid'); ok = false;
    }
    $('ffSave').disabled = !ok;
  }
  $('ffName').addEventListener('input', validate);
  validate();

  $('ffSave').onclick = async () => {
    const btn = $('ffSave');
    const name = ($('ffName').value || '').trim().toUpperCase();
    const description = ($('ffDesc').value || '').trim();
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Saving…';
    try {
      // `active` is only ever sent when editing. On create the server ignores
      // it and always opens the yard; on edit an ABSENT field means "leave it",
      // and `description` must be sent as a string or the server wipes it.
      const body = f
        ? { facility: name, description, active, rev: f.rev, recordedBy: prefs.getUser() }
        : { facility: name, description, recordedBy: prefs.getUser() };
      const res = await apiPost('upsertFacility', body);
      // The fallback mirrors what was SENT, never a hardcoded open-at-rev-1.
      // Hardcoding it meant that closing a yard, on a response that happened to
      // omit the record, merged it straight back as OPEN — directly after a
      // toast saying it had saved — and reset `rev` to 1, so the next edit took
      // a STALE_FACILITY_REV ("someone else changed it") that was untrue and
      // could not be cleared without a refresh.
      const saved = (res.data && res.data.facility) ? res.data : {
        facility: name,
        description,
        active: f ? active : true,          // create always opens the yard
        rev: f ? Number(f.rev) + 1 : 1
      };
      await SY.mergeFacility(saved);
      // A yard that has just been closed must stop filtering the stock screen.
      // An entry screen's selection is deliberately NOT cleared: 11.A accepts a
      // movement at a closed yard and flags it, and paintFacilitySelect already
      // says so on screen.
      setUiFacility(uiFacility);
      closeSheet();
      toast(f ? `${name} saved.` : `Warehouse ${name} added.`);
      await render();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = f ? 'Save changes' : 'Add warehouse';
      if (err instanceof ApiError && err.code === 'UNKNOWN_ACTION') {
        toast('This server has not been updated for warehouses yet.', 'error');
      } else if (err instanceof ApiError &&
          (err.code === 'DUPLICATE_FACILITY' || err.code === 'BAD_REQUEST')) {
        $('ffNameErr').textContent = err.message;
        $('ffName').classList.add('is-invalid');
      } else {
        toast(err.message || 'Could not save the warehouse.', 'error');
      }
    }
  };
}

/* ================= S4 balance ================= */
function matches(item, q) {
  if (!q) return true;
  const norm = s => String(s || '').toUpperCase().replace(/[-\s._]/g, '');
  const nq = norm(q);
  if (norm(item.sku).includes(nq)) return true;
  const desc = String(item.description || '').toUpperCase();
  return q.toUpperCase().split(/\s+/).filter(Boolean).every(tok => desc.includes(tok));
}

/**
 * The warehouse chip row above the stock list: All, then one chip per yard.
 *
 * Hidden entirely while there are no warehouses — an "All" chip on its own
 * filters nothing and just eats a row of screen on a phone.
 */
function renderFacilityChips() {
  const bar = $('balFacs');
  const facs = SY.state.facilities;
  // A closed yard still appears IF it is the one selected, so the screen can
  // never be filtered to something the chip row does not show.
  const shown = facs.filter(f => f.active !== false || f.facility === uiFacility);
  if (!shown.length) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = `<button class="chip-filter" data-fac=""
      aria-pressed="${String(!uiFacility)}">All warehouses</button>`
    + shown.map(f => `<button class="chip-filter${f.active === false ? ' is-closed' : ''}"
        data-fac="${esc(f.facility)}" aria-pressed="${String(f.facility === uiFacility)}"
        >${esc(f.facility)}${f.active === false ? ' · closed' : ''}</button>`).join('');
  for (const c of bar.querySelectorAll('[data-fac]')) {
    c.onclick = () => { setUiFacility(c.dataset.fac); renderBalance(); };
  }
}

async function renderBalance() {
  const all = await SY.projected();
  const q = ui.balSearch.trim();

  // A yard selected on a previous render may have been closed or removed since.
  setUiFacility(uiFacility);
  renderFacilityChips();

  // One row per (facility, sku). In a yard, show that yard's rows. In the All
  // view, sum each item across yards into ONE row — two yards holding the same
  // item otherwise render as two identical unlabelled lines.
  //
  // The All rows carry `facility: ''` deliberately. They are not a yard, and
  // every action path checks for exactly that before offering to do anything.
  let rows;
  if (uiFacility) {
    rows = all.filter(r => r.facility === uiFacility);
  } else {
    const byItem = new Map();
    for (const r of all) {
      const cur = byItem.get(r.sku) ||
        { facility: '', sku: r.sku, total: 0, damaged: 0, good: 0, pending: 0, lastTxnTs: '', yards: 0 };
      cur.total += r.total;
      cur.damaged += r.damaged;
      cur.good += r.good;
      cur.pending += r.pending || 0;
      if (r.total !== 0 || r.damaged !== 0) cur.yards += 1;
      if (String(r.lastTxnTs) > cur.lastTxnTs) cur.lastTxnTs = String(r.lastTxnTs || '');
      byItem.set(r.sku, cur);
    }
    rows = [...byItem.values()].sort((a, b) => (a.sku < b.sku ? -1 : a.sku > b.sku ? 1 : 0));
  }

  const enriched = rows.map(r => {
    const item = SY.itemBySku(r.sku);
    return { ...r, description: item?.description || '', uom: item?.uom || '' };
  }).filter(r => matches(r, q));

  const sorted = [...enriched];
  if (ui.balSort === 'stock') sorted.sort((a, b) => b.total - a.total);
  else if (ui.balSort === 'damaged') {
    sorted.sort((a, b) => (b.damaged - a.damaged) || (a.sku < b.sku ? -1 : 1));
  } else if (ui.balSort === 'recent') {
    sorted.sort((a, b) => String(b.lastTxnTs).localeCompare(String(a.lastTxnTs)));
  }

  const tot = sorted.reduce((s, r) => s + r.total, 0);
  const dmg = sorted.reduce((s, r) => s + r.damaged, 0);
  const list = $('balList');
  // Before the headline, not after it. A phone can hold cached balances while
  // its warehouse list is empty, and painting the summary first put a confident
  // "All warehouses · total 1,240" directly above "No warehouses yet".
  if (!SY.state.facilities.length) {
    $('balSummary').innerHTML = '';
    $('balCount').textContent = '';
    list.innerHTML = `<div class="empty"><span class="g">🏗</span>
      <h3>No warehouses yet</h3>
      <p>Add the yards you store stock in. Every receipt, issue and move is
         recorded against one of them.</p>
      <button class="btn" id="goFacs">+ Add a warehouse</button></div>`;
    $('goFacs').onclick = () => openFacilitiesSheet();
    return;
  }

  const scope = uiFacility ? esc(uiFacility) : 'All warehouses';
  $('balSummary').innerHTML = sorted.length ? `
    <div class="summary">
      <div class="eyebrow">${q ? `Matching total · ${scope}` : `${scope} · total`}</div>
      <div class="big">${n(tot)}</div>
      <div class="summary-chips">
        <span class="chip chip-good">✓ ${n(tot - dmg)} good</span>
        ${dmg > 0
          ? `<span class="chip chip-dmg">⚠ ${n(dmg)} damaged</span>`
          : '<span class="chip chip-neutral">⚠ none damaged</span>'}
      </div>
      ${stockBar(tot, dmg)}
    </div>` : '';

  $('balCount').textContent = sorted.length
    ? (q ? `${sorted.length} of ${rows.length} match “${q}”` : `${sorted.length} items in stock`)
    : '';

  if (!SY.state.items.length) {
    list.innerHTML = `<div class="empty"><span class="g">📦</span>
      <h3>No stock yet</h3><p>Add your items, then record what's in the yard.</p>
      <button class="btn" id="goItems">Go to Items</button></div>`;
    $('goItems').onclick = () => show('items');
    return;
  }
  if (!sorted.length) {
    list.innerHTML = q
      ? `<div class="empty"><span class="g">🔍</span><h3>No item matches “${esc(q)}”</h3>
         <button class="btn btn-ghost" id="clrS">Clear search</button></div>`

  list.innerHTML = sorted.map(r => `

        <span class="chip chip-good">✓ ${n(r.good)} good</span>

    // between the render and the tap cannot redirect an action to a yard the
    // user never saw.

  }
}

/**
 * @param {string} sku
 * @param {string} facility  '' means the ALL-warehouses view
 *
 * The split is the F10 defence and it is structural, not a check that could be
 * forgotten. The across-yards sheet carries NO Receive / Issue / Damage / Move
 * buttons at all: it shows where the stock actually is and makes you tap a
 * yard, which re-opens this sheet with that yard's figures. So there is no code
 * path anywhere in the app where an action is enabled by an across-yard total.
 * Adding a button to the aggregate sheet would be the bug; there is nothing to
 * accidentally leave un-gated.
 */
async function openItemDetail(sku, facility) {
  const fac = normFacility(facility);
  if (!fac) return openItemAllYards(sku);
  return openItemAtFacility(sku, fac);

        <button class="row" data-yard="${esc(r.facility)}">
          <span class="row-main">
            <span class="row-sku">${esc(r.facility)}${isClosedFacility(r.facility) ? ' · closed' : ''}</span>
            <span class="row-desc">✓ ${n(r.good)} good${r.damaged > 0 ? ` · ⚠ ${n(r.damaged)} damaged` : ''}${r.pending ? ` · ⟳ ${r.pending} pending` : ''}</span>
          </span>
          <span class="row-num"><span class="v" style="font-size:var(--fs-lg)">${n(r.total)}</span></span>

          <span class="row-main">
            <span class="row-sku">No warehouse recorded</span>
            <span class="row-desc">${n(r.total)} total · recorded before warehouses were added</span>
