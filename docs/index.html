/** One warehouse. Every action here is gated on THIS yard's good stock. */
async function openItemAtFacility(sku, facility) {
  // The yard here arrives off a BALANCE row (`data-yard`, `data-fac`), which is
  // a different read from the warehouse list. If the two disagree, refuse to
  // paint an action set for a yard the server will not accept, and fall back to
  // the read-only across-yards view where the stock is still visible.
  const fac = knownFacility(facility);
  if (!fac) {
    if (normFacility(facility)) {
      toast(`Warehouse "${normFacility(facility)}" is not in the warehouse list.`, 'error');
    }
    return openItemAllYards(sku);
  }
  const item = SY.itemBySku(sku);
  const b = await SY.projectedFor(fac, sku);
  const closed = isClosedFacility(fac);
  // Nowhere to move stock TO unless a second open yard exists.
  const canMove = activeFacilities().filter(f => f.facility !== fac).length > 0;
  openSheet({
    title: sku,
    body: `
      <p style="color:var(--muted);font-size:var(--fs-sm)">
        ${esc(item?.description || '')}${item?.uom ? ' · ' + esc(item.uom) : ''}
      </p>
      <div class="fac-note">🏗 <span><b>${esc(fac)}</b>${closed ? ' · this warehouse is closed' : ''}${
        SY.state.facilities.length > 1
          ? ' — these figures and every button below are for this warehouse only.'
          : ''}</span></div>
      <div class="equation">
        <span class="term"><span class="v">${n(b.total)}</span>
          <span class="eyebrow" style="display:block">total</span></span>
        <span class="op">=</span>
        <span class="term"><span class="v" style="color:var(--good-ink)">${n(b.good)}</span>
          <span class="eyebrow" style="display:block">good</span></span>
        <span class="op">+</span>
        <span class="term"><span class="v" style="color:var(--rsa-red)">${n(b.damaged)}</span>
          <span class="eyebrow" style="display:block">damaged</span></span>
      </div>
      <div style="height:16px;border-radius:var(--r-pill);background:var(--good);overflow:hidden;display:flex">
        <div style="background:var(--rsa-red);width:${b.total ? (b.damaged / b.total) * 100 : 0}%"></div>
      </div>
      <div class="btn-row" style="margin-top:var(--s-5)">
        <button class="btn btn-ghost" id="dtRcv">⬇ Receive</button>
        <button class="btn btn-ghost" id="dtIss" ${b.good <= 0 ? 'disabled' : ''}>⬆ Issue</button>
      </div>
      <div class="btn-row" style="margin-top:var(--s-2)">
        <button class="btn btn-danger" id="dtDmg"
          ${b.good <= 0 ? 'disabled' : ''}>⚠ Record damage</button>
        <button class="btn btn-ghost" id="dtMove"
          ${b.good <= 0 || !canMove ? 'disabled' : ''}>⇄ Move stock</button>
      </div>
      ${b.good <= 0
        ? `<div class="field-help">No good stock at ${esc(fac)} to damage or move.</div>`
        : (!canMove
          ? '<div class="field-help">Add a second warehouse to move stock between them.</div>'
          : '')}
      ${b.total === 0 && b.damaged === 0 && !b.pending ? `<button class="btn btn-ghost" id="dtOpen"
        style="margin-top:var(--s-2)">📋 Set opening stock at ${esc(fac)}</button>` : ''}
      ${SY.state.facilities.length > 1 ? `<button class="btn btn-ghost" id="dtAll"
        style="margin-top:var(--s-2)">See all warehouses</button>` : ''}
      <div class="eyebrow" style="margin-top:var(--s-6)">Recent movements · ${esc(fac)}</div>
      <div id="dtMoves"><div class="skel"></div></div>`
  });
  // Both carry the yard into the entry screen. This is the 10.A exception to
  // "no pre-fill": the action was started from a place that already names one
  // warehouse, so asking again would be asking a question already answered.
  $('dtRcv').onclick = () => { closeSheet(); ui.rcvSku = sku; show('receive', fac); };
  $('dtIss').onclick = () => { closeSheet(); ui.issSku = sku; show('issue', fac); };
  $('dtDmg').onclick = () => openDamageSheet(sku, fac);
  $('dtMove').onclick = () => openTransferSheet(sku, fac);
  if ($('dtOpen')) $('dtOpen').onclick = () => openOpeningSheet(sku, fac);
  if ($('dtAll')) $('dtAll').onclick = () => openItemAllYards(sku);
  loadMoves(sku, fac);
}

/** Movement classes and labels, shared by the queued and the server lists. */
const MV_CLASS = { INBOUND:'IN', OPENING:'IN', OUTBOUND:'OUT', TRANSFER:'OUT',
  DAMAGE:'DMG', REPAIR:'IN', VOID:'DMG' };
const MV_LABEL = { INBOUND:'RECEIVED', OPENING:'OPENING', OUTBOUND:'ISSUED',
  TRANSFER:'MOVED', DAMAGE:'DAMAGED', REPAIR:'REPAIRED', VOID:'CANCELLED' };

/**
 * @param {string} sku
 * @param {string} facility  '' for every warehouse
 *
 * A TRANSFER is history at BOTH ends — it left one yard and arrived at another
 * — so it is kept when either end matches. The server's getLedger applies the
 * same rule to the same param, so the queued list and the uploaded list agree
 * about what belongs on this screen.
 */
async function loadMoves(sku, facility) {
  const el = $('dtMoves');
  if (!el) return;
  const want = normSku(sku);
  const fac = normFacility(facility);
  const queued = (await OB.pendingItems()).filter(i =>
    normSku(i.sku) === want &&
    (!fac || normFacility(i.facility) === fac || normFacility(i.toFacility) === fac));
  const localHtml = queued.map(i => {
    const t = String(i.type || '').toUpperCase();
    // At the destination of a pending transfer the movement is an ARRIVAL, and
    // labelling it "MOVED OUT" there would read as stock leaving.
    const arriving = t === 'TRANSFER' && fac && normFacility(i.toFacility) === fac;
    const label = arriving ? 'MOVED IN' : (MV_LABEL[t] || t);
    const route = t === 'TRANSFER'
      ? `${esc(i.facility)} → ${esc(i.toFacility)}`
      : esc(i.facility || '');
    return `<div class="mv ${arriving ? 'IN' : (MV_CLASS[t] || 'DMG')}">
      <span class="t"><b>${esc(label)}</b>
        <span class="when">${route}${route ? ' · ' : ''}${esc(prefs.getUser() || '')} · not uploaded yet</span></span>
      <span class="q">${n(i.payload.qty)}</span>
      <span class="pending-tag">⟳</span>
    </div>`;
  }).join('');

  let serverHtml = '';
  try {
    const { apiGet } = await import('./lib/api.js');
    const params = { sku, limit: '10' };
    if (fac) params.facility = fac;
    const res = await apiGet('getLedger', params);
    const rows = (res.data && res.data.rows) || [];
    serverHtml = rows.length ? rows.map(r => {
      const type = String(r.type || '').toUpperCase();
      const arriving = type === 'TRANSFER' && fac && normFacility(r.toFacility) === fac;
      const cls = arriving ? 'IN' : (MV_CLASS[type] || 'DMG');
      const label = arriving ? 'MOVED IN' : (MV_LABEL[type] || type);
      const extra = r.damagedQty > 0 && type === 'INBOUND' ? ` (${n(r.damagedQty)} dmg)` : '';
      // Always say WHERE when the sheet is not already scoped to one yard.
      const where = type === 'TRANSFER'
        ? `${esc(r.facility)} → ${esc(r.toFacility)}`
        : esc(r.facility || '');
      return `<div class="mv ${cls}">
        <span class="t"><b>${esc(label)}</b>${extra}
          <span class="when">${where && (!fac || type === 'TRANSFER') ? where + ' · ' : ''}${esc(r.recordedBy)} · ${when(r.clientTs || r.serverTs)}</span>
          ${r.vehicleNo ? `<span class="when">🚚 ${esc(r.vehicleNo)}</span>` : ''}
          ${r.remarks ? `<span class="when">${esc(r.remarks)}</span>` : ''}</span>
        <span class="q">${n(r.qty)}</span></div>`;
    }).join('') : '<p style="color:var(--muted);font-size:var(--fs-sm)">No movements recorded yet.</p>';
  } catch {
    serverHtml = '<p style="color:var(--muted);font-size:var(--fs-sm)">Movement history needs a connection.</p>';
  }
  if ($('dtMoves')) $('dtMoves').innerHTML = localHtml + serverHtml;
}

/* ================= item picker ================= */
async function openPicker(target) {
  ui.pickerTarget = target;
  const recent = prefs.getRecent();
  openSheet({
    title: 'Choose item',
    search: `<div class="search" style="margin-bottom:var(--s-3)">
        <span class="ico">🔍</span>
        <input id="pkSearch" type="search" inputmode="search" autocomplete="off" spellcheck="false"
          autocapitalize="characters" placeholder="Search SKU or description">
      </div>`,
    body: '<div id="pkList"></div>'
  });
  // The yard whose stock this picker should quote — the ENTRY SCREEN's, never
  // the stock screen's. `projected()` is one row per (facility, sku), so a bare
  // `.find(b => b.sku === sku)` returns whichever yard sorts FIRST: with YARD A
  // holding 350 and YARD B holding 0, the picker opened for YARD B showed 350.
  // A plausible number, never an error.
  const facOf = t => (t === 'rcv' ? ui.rcvFacility : ui.issFacility);

  const paint = async () => {
    const q = ($('pkSearch')?.value || '').trim();
    const bals = await SY.projected();
    const fac = normFacility(facOf(target));
    const balOf = sku =>
      bals.find(b => b.facility === fac && b.sku === sku)
      || { total:0, damaged:0, good:0 };
    const all = SY.state.items.filter(i => i.active !== false && matches(i, q));

    const rowHtml = i => {
      const b = balOf(i.sku);
      return `<button class="row" data-pick="${esc(i.sku)}">
        <span class="row-main">
          <span class="row-sku">${esc(i.sku)}</span>
          <span class="row-desc">${esc(i.description)}</span>
        </span>
        <span class="row-num">
          ${fac
            ? `<span class="v" style="font-size:var(--fs-md)">${n(b.total)}</span>`
            : '<span class="v" style="font-size:var(--fs-md);color:var(--muted)">—</span>'}
          <span class="eyebrow" style="display:block">${esc(i.uom || '')}</span></span>
      </button>`;
    };

    let html = fac
      ? `<div class="fac-note">🏗 <span>Stock shown is at <b>${esc(fac)}</b>.</span></div>`
      : `<div class="fac-note">🏗 <span>Choose a warehouse on the previous screen to see
           how much of each item is there.</span></div>`;
    if (!q && recent.length) {
      const rec = recent.map(s => all.find(i => i.sku === s)).filter(Boolean);
      if (rec.length) {
        html += '<div class="eyebrow" style="margin-bottom:var(--s-2)">Recent</div>'
          + rec.map(rowHtml).join('')
          + `<div class="eyebrow" style="margin:var(--s-4) 0 var(--s-2)">All items · ${all.length}</div>`;
      }
    }
    const shown = all.slice(0, 60);
    html += shown.map(rowHtml).join('');
    if (all.length > shown.length) {
      html += `<p style="color:var(--muted);font-size:var(--fs-sm);text-align:center;padding:var(--s-3)">
        ${all.length - shown.length} more — keep typing to narrow it down</p>`;
    }
    if (!all.length) {
      html = `<div class="empty"><span class="g">🔍</span>
        <h3>No item matches “${esc(q)}”</h3>
        <p>Check the code, or add it as a new item.</p>
        <button class="btn btn-ghost" id="pkAdd">+ Add “${esc(q.toUpperCase())}” as a new item</button>
      </div>`;
    }
    $('pkList').innerHTML = html;
    for (const b of $('pkList').querySelectorAll('[data-pick]')) {
      b.onclick = () => choosePick(b.dataset.pick);
    }
    if ($('pkAdd')) $('pkAdd').onclick = () => openItemForm(null, q.toUpperCase());
  };
  $('pkSearch').oninput = debounce(paint, 150);
  await paint();
}

function choosePick(sku) {
  prefs.pushRecent(sku);
  if (ui.pickerTarget === 'rcv') ui.rcvSku = sku;
  else ui.issSku = sku;
  closeSheet();
  render();
}

for (const el of document.querySelectorAll('[data-picker]')) {
  el.onclick = () => openPicker(el.dataset.picker);
}

for (const el of document.querySelectorAll('[data-fac-picker]')) {
  const target = el.dataset.facPicker;
  el.onclick = () => openFacilityPicker({
    title: target === 'rcv' ? 'Receive into which warehouse?' : 'Issue from which warehouse?',
    current: target === 'rcv' ? ui.rcvFacility : ui.issFacility,
    onPick: fac => {
      // A SCREEN opened this picker, so the sheet has to be closed here —
      // openFacilityPicker deliberately does not do it.
      closeSheet();
      if (target === 'rcv') ui.rcvFacility = fac; else ui.issFacility = fac;
      // Changing the yard changes the available stock, so the quantity already
      // typed may no longer be valid. paintIssue re-runs the check against the
      // new yard and disables the button; it must never be skipped here.
      render();
    }
  });
}

/* ================= steppers ================= */
function readNum(id) {
  const v = ($(id).value || '').replace(/[^\d]/g, '');
  return v === '' ? null : parseInt(v, 10);
}

function bumpField(id, by) {
  const cur = readNum(id) ?? 0;
  const next = Math.max(0, Math.min(999999, cur + by));
  $(id).value = String(next);
  onFormInput();
}

for (const b of document.querySelectorAll('[data-step]')) {
  b.onclick = () => bumpField(b.dataset.step, parseInt(b.dataset.by, 10));
}
for (const id of ['rcvQty','rcvDmg','issQty']) {
  $(id).addEventListener('input', e => {
    const clean = e.target.value.replace(/[^\d]/g, '').slice(0, 6);
    if (clean !== e.target.value) e.target.value = clean;
    onFormInput();
  });
}
function onFormInput() {
  if (ui.screen === 'receive') paintReceive();
  else if (ui.screen === 'issue') paintIssue();
}

/* ================= S2 receive ================= */
/**
 * Paint the warehouse selector on an entry screen.
 * @return {string} the chosen facility, normalised ('' when none)
 */
function paintFacilitySelect(selId, errId, facility) {
  const fac = normFacility(facility);
  const sel = $(selId);
  sel.classList.remove('is-invalid');
  const closed = fac && isClosedFacility(fac);
  sel.innerHTML = fac ? `
      <span class="row-main">
        <span class="row-sku">${esc(fac)}</span>
        ${closed
          ? '<span class="row-desc" style="color:var(--rsa-red)">This warehouse is closed — the entry will still be recorded and flagged</span>'
          : `<span class="row-desc">${esc(SY.facilityByName(fac)?.description || '')}</span>`}
      </span><span class="chg">Change</span>`
    : '<span class="row-main"><span class="placeholder">Tap to choose warehouse</span></span>';
  $(errId).textContent = '';
  return fac;
}

async function renderReceive() {
  if (!SY.state.facilities.length) {
    $('rcvSubmit').disabled = true;
    $('rcvCtx').hidden = false;
    $('rcvCtx').innerHTML = 'Add a warehouse before recording stock — every entry is '
      + 'recorded against one.';
    return;
  }
  if (!SY.state.items.length) {
    $('rcvSubmit').disabled = true;
    $('rcvCtx').hidden = false;
    $('rcvCtx').innerHTML = 'Add a SKU in Items before receiving stock.';
    return;
  }
  await paintReceive();
}

async function paintReceive() {
  const sku = ui.rcvSku;
  // Self-heal rather than only refusing at submit: a warehouse that has left
  // the list (removed by hand in the Sheet, or a list refreshed underneath an
  // open form) drops back to "Tap to choose warehouse" here, so the screen
  // never shows a yard the entry would then be refused for.
  ui.rcvFacility = knownFacility(ui.rcvFacility);
  const fac = paintFacilitySelect('rcvFac', 'rcvFacErr', ui.rcvFacility);
  const item = sku ? SY.itemBySku(sku) : null;
  const sel = $('rcvItem');
  sel.classList.remove('is-invalid');
  sel.innerHTML = item ? `
      <span class="row-main">
        <span class="row-sku">${esc(item.sku)}</span>
        <span class="row-desc">${esc(item.description)} · ${esc(item.uom)}</span>
      </span><span class="chg">Change</span>`
    : '<span class="row-main"><span class="placeholder">Tap to choose item</span></span>';

  $('rcvUom').textContent = item ? `(${item.uom})` : '';
  const ctx = $('rcvCtx');
  if (item && fac) {
    const b = await SY.projectedFor(fac, sku);
    ctx.hidden = false;
    ctx.innerHTML = `At <b>${esc(fac)}</b> now — <b>${n(b.total)}</b> total · ✓ ${n(b.good)} good · ⚠ ${n(b.damaged)} damaged`;
  } else { ctx.hidden = true; }

  const qty = readNum('rcvQty');
  const dmg = readNum('rcvDmg') ?? 0;
  const qErr = $('rcvQtyErr'), dErr = $('rcvDmgErr');
  qErr.textContent = ''; dErr.textContent = '';
  $('rcvQty').classList.remove('is-invalid');
  $('rcvDmg').classList.remove('is-invalid');

  // 5.A: no warehouse, no entry. The server refuses a facility-less row
  // outright (UNKNOWN_FACILITY, non-retryable), so letting it be submitted
  // would put a real movement straight into the failures list.
  let valid = !!item && !!fac;
  if (qty === null) { valid = false; }
  else if (qty < 1) { qErr.textContent = 'Quantity must be at least 1.'; $('rcvQty').classList.add('is-invalid'); valid = false; }
  if (qty !== null && dmg > qty) {
    dErr.textContent = `Damaged cannot be more than the ${n(qty)} you received.`;
    $('rcvDmg').classList.add('is-invalid');
    valid = false;
  }

  const pv = $('rcvPreview');
  if (item && fac && qty !== null && qty >= 1 && dmg <= qty) {
    const b = await SY.projectedFor(fac, sku);
    pv.hidden = false;
    pv.innerHTML = `
      <div class="line"><span>Receiving <b>${n(qty)}</b></span>
        <span>→ <b style="color:var(--good-ink)">${n(qty - dmg)} good</b> + <b style="color:var(--rsa-red)">${n(dmg)} damaged</b></span></div>
      ${stockBar(qty, dmg)}
      <div class="line" style="margin-top:var(--s-3);color:var(--muted)">
        <span>${esc(fac)} after this</span>
        <span>${n(b.total + qty)} total · ${n(b.good + qty - dmg)} good · ${n(b.damaged + dmg)} damaged</span></div>`;
  } else { pv.hidden = true; }

  $('rcvSubmit').disabled = !valid;
  $('rcvSubmit').textContent = valid ? `Receive ${n(qty)} ${item.uom} into ${fac}` : 'Receive';
}

$('rcvSubmit').onclick = async () => {
  const btn = $('rcvSubmit');
  const sku = ui.rcvSku;
  // knownFacility, not normFacility: the button is the last gate before a real
  // movement is written, and an entry naming a warehouse the server does not
  // have is refused NON-retryably — it would land in the failures list instead
  // of in the yard. Re-checked here rather than trusted from paintReceive
  // because the warehouse list refreshes in the background.
  const fac = knownFacility(ui.rcvFacility);
  const qty = readNum('rcvQty');
  const dmg = readNum('rcvDmg') ?? 0;
  if (!sku || !fac || qty === null || qty < 1 || dmg > qty) {
    // Say so. Re-painting alone resets the warehouse field to its placeholder
    // and disables the button, which is correct but reads as the tap simply
    // not registering — and a yard worker taps again, and again.
    if (sku && !fac && ui.rcvFacility) {
      toast(`Warehouse "${ui.rcvFacility}" is no longer in the list — choose one.`, 'error');
    }
    await paintReceive();
    return;
  }

  btn.disabled = true;
  const { settled } = await OB.enqueue({
    type: 'INBOUND', sku, facility: fac,
    payload: { qty, damagedQty: dmg, refNo: $('rcvRef').value.trim(), remarks: $('rcvNote').value.trim() },
    recordedBy: prefs.getUser()
  });
  buzz();
  const item = SY.itemBySku(sku);
  toast(dmg > 0
    ? `Received ${n(qty)} ${item.uom} of ${sku} into ${fac}. ${n(dmg)} damaged.`
    : `Received ${n(qty)} ${item.uom} of ${sku} into ${fac}.`);
  // Keep the item selected — several trucks of the same SKU arrive in a row.
  $('rcvQty').value = ''; $('rcvDmg').value = '0';
  $('rcvRef').value = ''; $('rcvNote').value = '';
  await paintReceive();
  await renderSync();
  settleInBackground(settled);
  warnOfflineOnce();
};

/* ================= S3 issue ================= */
async function renderIssue() {
  if (!SY.state.items.length || !SY.state.facilities.length) {
    $('issSubmit').disabled = true;
    return;
  }
  await paintIssue();
}

async function paintIssue() {
  const sku = ui.issSku;
  // Same self-heal as paintReceive.
  ui.issFacility = knownFacility(ui.issFacility);
  const fac = paintFacilitySelect('issFac', 'issFacErr', ui.issFacility);
  const item = sku ? SY.itemBySku(sku) : null;
  const sel = $('issItem');
  sel.classList.remove('is-invalid');
  sel.innerHTML = item ? `
      <span class="row-main">
        <span class="row-sku">${esc(item.sku)}</span>
        <span class="row-desc">${esc(item.description)} · ${esc(item.uom)}</span>
      </span><span class="chg">Change</span>`
    : '<span class="row-main"><span class="placeholder">Tap to choose item</span></span>';
  $('issUom').textContent = item ? `(${item.uom})` : '';

  const av = $('issAvail');
  // `good` is THIS warehouse's good stock and nothing else. It gates the
  // button, the "All" chip, the quantity check and the preview — F10 in one
  // variable. It stays 0 until a warehouse is chosen, so nothing is issuable
  // from "nowhere", and it is never an across-yard total.
  let good = 0;
  if (item && fac) {
    const b = await SY.projectedFor(fac, sku);
    good = b.good;
    av.hidden = false;
    av.className = 'avail' + (good <= 0 ? ' zero' : '');
    av.innerHTML = `
      <div class="eyebrow">Available to issue at ${esc(fac)}</div>
      <div class="v">${n(good)}</div>
      <div style="font-size:var(--fs-sm);color:var(--muted)">${esc(item.uom)}</div>
      ${stockBar(b.total, b.damaged)}
      <div class="sub">${good <= 0
        ? `Nothing available to issue at ${esc(fac)}.`
        : `${n(b.total)} total · ${n(b.damaged)} damaged can't be issued`}</div>`;
    $('issAll').textContent = `All ${n(good)}`;
  } else {
    av.hidden = true;
    $('issAll').textContent = 'All';
  }

  const qty = readNum('issQty');
  const err = $('issQtyErr');
  err.textContent = '';
  $('issQty').classList.remove('is-invalid');

  let valid = !!item && !!fac && good > 0;
  if (qty === null) valid = false;
  else if (qty < 1) { err.textContent = 'Quantity must be at least 1.'; valid = false; }
  else if (item && fac && qty > good) {
    err.textContent = `Only ${n(good)} ${item.uom} available at ${fac}. You can't issue more than that.`;
    $('issQty').classList.add('is-invalid');
    valid = false;
  }

  const pv = $('issPreview');
  if (valid) {
    const b = await SY.projectedFor(fac, sku);
    pv.hidden = false;
    pv.innerHTML = `<div class="line"><span>Left at ${esc(fac)} after this</span>
      <span><b>${n(b.good - qty)} good</b> · ${n(b.total - qty)} total</span></div>
      ${qty === good ? `<span class="chip chip-neutral" style="margin-top:var(--s-2)">This will empty the good stock at ${esc(fac)}</span>` : ''}`;
  } else { pv.hidden = true; }

  $('issSubmit').disabled = !valid;
  $('issSubmit').textContent = valid ? `Issue ${n(qty)} ${item.uom} from ${fac}` : 'Issue';
};

/**
 * Recently-used vehicle numbers as one-tap chips. Renders nothing at all when
 * the list is empty, so a first-time user never sees an empty grey strip.
 */
function renderVehicleChips() {
  const box = $('issVehChips');
  const list = prefs.getRecentVehicles();
  box.hidden = !list.length;
  box.innerHTML = list.map(v =>
    `<button type="button" class="chip-add" data-veh="${esc(v)}">${esc(v)}</button>`).join('');
  for (const b of box.querySelectorAll('[data-veh]')) {
    b.onclick = () => { $('issVehicle').value = b.dataset.veh; };
  }
}
renderVehicleChips();

// Plates are recorded upper case everywhere, and the server uppercases anyway.
// Doing it here as well keeps the recents list from filling with 'ab-1234' and
// 'AB-1234' as two different trucks.
$('issVehicle').oninput = e => {
  const pos = e.target.selectionStart;
  e.target.value = e.target.value.toUpperCase();
  try { e.target.setSelectionRange(pos, pos); } catch { /* not selectable */ }
};

$('issAll').onclick = async () => {
  // "All" means all of what is HERE. Without a warehouse there is no here, so
  // it fills nothing rather than filling in an across-yard total.
  if (!ui.issSku || !ui.issFacility) return;
  const b = await SY.projectedFor(ui.issFacility, ui.issSku);
  $('issQty').value = String(Math.max(0, b.good));
  paintIssue();
};

$('issSubmit').onclick = async () => {
  const sku = ui.issSku;
  const fac = knownFacility(ui.issFacility);
  const qty = readNum('issQty');
  if (!sku || !fac || qty === null || qty < 1) {
    if (sku && !fac && ui.issFacility) {
      toast(`Warehouse "${ui.issFacility}" is no longer in the list — choose one.`, 'error');
    }
    await paintIssue();
    return;
  }
  // Last gate before a real movement: re-check against THIS yard, not the
  // figure the screen was painted with.
  const before = await SY.projectedFor(fac, sku);
  if (qty > before.good) { await paintIssue(); return; }
  $('issSubmit').disabled = true;

  const vehicleNo = $('issVehicle').value.trim().toUpperCase();
  const { settled } = await OB.enqueue({
    type: 'OUTBOUND', sku, facility: fac,
    payload: {
      qty, condition: 'GOOD', refNo: $('issRef').value.trim(),
      vehicleNo, remarks: $('issNote').value.trim()
    },
    recordedBy: prefs.getUser()
  });
  if (vehicleNo) prefs.pushRecentVehicle(vehicleNo);
  buzz();
  const item = SY.itemBySku(sku);
  const after = await SY.projectedFor(fac, sku);
  toast(`Issued ${n(qty)} ${item.uom} of ${sku} from ${fac}. ${n(after.good)} good left there.`);
  $('issQty').value = ''; $('issRef').value = '';
  $('issVehicle').value = ''; $('issNote').value = '';
  renderVehicleChips();
  await paintIssue();
  await renderSync();
  settleInBackground(settled);
  warnOfflineOnce();
};

/* ================= S5 record damage ================= */
/**
 * @param {string} sku
 * @param {string} facility  REQUIRED — damage is always at one warehouse
 *
 * There is no all-warehouses damage sheet. The only way in is the per-yard item
 * detail, so `maxGood` below is always one yard's good stock. Changing the yard
 * re-opens the sheet rather than mutating it, because `maxGood` is captured at
 * open and a half-updated sheet would police the old yard's limit.
 */
async function openDamageSheet(sku, facility) {
  const fac = normFacility(facility);
  if (!fac) return;
  const item = SY.itemBySku(sku);
  const b = await SY.projectedFor(fac, sku);
  // Only yards that actually hold good stock of this item can be damaged at, so
  // they are the only ones the change-warehouse picker offers.
  const damageable = (await SY.projected())
    .filter(r => r.sku === normSku(sku) && r.good > 0 && r.facility)
    .map(r => r.facility);
  // Refuse up front rather than opening a form whose limit is 0 and whose
  // submit can never enable — the same guard openTransferSheet has. Reachable
  // because stock can move between this sheet being offered and being opened.
  if (b.good <= 0) { toast(`No good stock at ${fac} to damage.`, 'error'); return; }
  const otherYards = damageable.some(f => f !== fac);
  openSheet({
    title: 'Record damage',
    body: `
      <p style="font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--s-3)">
        ${esc(sku)} · ${esc(item?.description || '')}</p>
      <div class="field">
        <span class="field-label eyebrow">Warehouse <span class="req">*</span></span>
        <button class="item-select" id="dmgFac"${otherYards ? '' : ' disabled'}>
          <span class="row-main">
            <span class="row-sku">${esc(fac)}</span>
            <span class="row-desc">✓ ${n(b.good)} good here</span>
          </span>${otherYards ? '<span class="chg">Change</span>' : ''}
        </button>
      </div>
      <div class="note-info">
        This does <b>NOT</b> reduce your total stock.<br>
        It moves stock from <b>GOOD to DAMAGED</b> at ${esc(fac)}.
      </div>
      <div class="field">
        <label class="field-label eyebrow" for="dmgQty">
          How many are damaged? <span class="req">*</span> (${esc(item?.uom || '')})</label>
        <div class="stepper">
          <button type="button" id="dmgMinus" aria-label="Less">−</button>
          <input id="dmgQty" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"
            placeholder="0" aria-label="Damaged quantity">
          <button type="button" id="dmgPlus" aria-label="More">+</button>
        </div>
        <div class="chips" id="dmgChips">
          <button class="chip-add" data-dmg="1">+1</button>
          <button class="chip-add" data-dmg="5">+5</button>
          <button class="chip-add" data-dmg="10">+10</button>
        </div>
        <div class="field-help">Max ${n(b.good)} good available</div>
        <div class="field-error" id="dmgErr"></div>
      </div>
      <div class="preview" id="dmgPreview" hidden></div>
      <div class="field">
        <span class="field-label eyebrow">Reason <span class="req">*</span></span>
        <div class="tiles" id="dmgReasons">
          ${REASONS.map(r => `<button class="tile" data-reason="${esc(r)}" aria-pressed="false">${esc(r)}</button>`).join('')}
        </div>
        <div class="field-error" id="dmgReasonErr"></div>
      </div>
      <div class="field" id="dmgOtherWrap" hidden>
        <label class="field-label eyebrow" for="dmgOther">Details <span class="req">*</span></label>
        <textarea class="field-input" id="dmgOther" rows="2" maxlength="120"
          autocapitalize="sentences"></textarea>
      </div>`,
    foot: `<button class="btn btn-danger" id="dmgSubmit" disabled>⚠ Record as damaged</button>`
  });

  let reason = null;
  const maxGood = b.good;

  $('dmgFac').onclick = () => {
    if (!otherYards) return;
    openFacilityPicker({
      title: 'Damage at which warehouse?',
      current: fac,
      allow: damageable,
      // Re-open, never patch. maxGood, the preview and the confirmation text
      // are all computed from the yard this sheet was opened for.
      onPick: next => openDamageSheet(sku, next)
    });
  };

  const repaint = () => {
    const qty = readNum('dmgQty');
    const err = $('dmgErr');
    err.textContent = '';
    $('dmgQty').classList.remove('is-invalid');
    let valid = true;
    if (qty === null) valid = false;
    else if (qty < 1) { err.textContent = 'Quantity must be at least 1.'; valid = false; }
    else if (qty > maxGood) {
      err.textContent = `Only ${n(maxGood)} good ${item?.uom || 'units'} available. You can't mark more than that as damaged.`;
      $('dmgQty').classList.add('is-invalid');
      valid = false;
    }
    const pv = $('dmgPreview');
    if (qty !== null && qty >= 1 && qty <= maxGood) {
      pv.hidden = false;
      pv.innerHTML = `
        <div class="line"><span>TOTAL <b>${n(b.total)}</b> → <b>${n(b.total)}</b></span>
          <span style="font-weight:var(--fw-8)">(unchanged)</span></div>
        <div class="line"><span>✓ GOOD ${n(b.good)} → <b style="color:var(--good-ink)">${n(b.good - qty)}</b></span>
          <span>⚠ DAMAGED ${n(b.damaged)} → <b style="color:var(--rsa-red)">${n(b.damaged + qty)}</b></span></div>
        ${stockBar(b.total, b.damaged + qty)}`;
    } else { pv.hidden = true; }

    if (!reason) valid = false;
    if (reason === 'Other' && $('dmgOther').value.trim().length < 3) valid = false;
    $('dmgSubmit').disabled = !valid;
    $('dmgSubmit').textContent = (qty && qty >= 1) ? `⚠ Record ${n(qty)} as damaged` : '⚠ Record as damaged';
  };

  $('dmgQty').addEventListener('input', e => {
    const clean = e.target.value.replace(/[^\d]/g, '').slice(0, 6);
    if (clean !== e.target.value) e.target.value = clean;
    repaint();
  });
  const bump = by => {
    const cur = readNum('dmgQty') ?? 0;
    $('dmgQty').value = String(Math.max(0, Math.min(maxGood, cur + by)));
    repaint();
  };
  $('dmgMinus').onclick = () => bump(-1);
  $('dmgPlus').onclick = () => bump(1);
  for (const c of $('dmgChips').querySelectorAll('[data-dmg]')) {
    c.onclick = () => bump(parseInt(c.dataset.dmg, 10));
  }
  for (const t of $('dmgReasons').querySelectorAll('[data-reason]')) {
    t.onclick = () => {
      reason = t.dataset.reason;
      for (const o of $('dmgReasons').querySelectorAll('[data-reason]')) {
        o.setAttribute('aria-pressed', String(o === t));
      }
      $('dmgOtherWrap').hidden = reason !== 'Other';
      $('dmgReasonErr').textContent = '';
      repaint();
    };
  }
  $('dmgOther').addEventListener('input', repaint);

  $('dmgSubmit').onclick = () => {
    const qty = readNum('dmgQty');
    if (!qty || qty < 1 || qty > maxGood || !reason) return;
    const detail = reason === 'Other' ? $('dmgOther').value.trim() : '';
    confirmSheet({
      title: 'Mark as damaged?',
      message: `<b>${n(qty)} ${esc(item?.uom || '')}</b> of ${esc(sku)} at <b>${esc(fac)}</b> · ${esc(reason)}.<br><br>
        Good stock at ${esc(fac)} goes ${n(b.good)} → <b>${n(b.good - qty)}</b>.
        Total stays <b>${n(b.total)}</b>.`,
      confirmLabel: 'Yes, record damage',
      danger: true,
      onConfirm: async () => {
        // `maxGood` was captured when the sheet opened, and confirmSheet has
        // just added a second dwell on top of that. A background sync or
        // another phone's issue from this yard can land in between, so the
        // limit is re-read here against the CURRENT projection. Without it the
        // entry is enqueued and bounces back as DAMAGE_EXCEEDS_GOOD, which
        // reaches the user as a failure rather than as a full form.
        const nowFac = knownFacility(fac);
        const now = nowFac ? await SY.projectedFor(nowFac, sku) : { good: 0 };
        if (!nowFac || qty > now.good) {
          // Close it: confirmSheet has replaced the form, so leaving the sheet
          // up strands the user on a button that can only ever re-toast.
          closeSheet();
          toast(nowFac
            ? `Only ${n(now.good)} good left at ${nowFac} now — nothing recorded.`
            : `Warehouse "${fac}" is not in the warehouse list.`, 'error');
          await render();
          return;
        }
        const { settled } = await OB.enqueue({
          type: 'DAMAGE', sku, facility: nowFac,
          payload: { qty, remarks: detail ? `${reason}: ${detail}` : reason },
          recordedBy: prefs.getUser()
        });
        buzz();
        toast(`${n(qty)} ${item?.uom || ''} marked damaged at ${fac}. Total stock unchanged.`);
        await render();
        settleInBackground(settled);
        warnOfflineOnce();
      }
    });
  };
  repaint();
}

/* ================= S6 move stock between warehouses ================= */

/**
 * @param {string} sku
 * @param {string} fromFacility  REQUIRED — the yard the stock is leaving
 *
 * ONE ledger row, typed TRANSFER, that moves the balance at two places at
 * once (PLAN A4). The client sends one outbox entry; `deltasFor` turns it into
 * two keyed deltas on both sides of the wire, so nothing here has to know that
 * a transfer is special.
 *
 * The source is fixed by where the sheet was opened from and is never a picker:
 * `maxGood` is the source's good stock, and letting the source change under a
 * typed quantity is the same class of bug as gating on an aggregate.
 *
 * Damaged stock does not move (PLAN A4). That is a scope decision, not an
 * oversight, and the server enforces it too — it zeroes dDamaged on both legs
 * whatever `condition` says.
 */
async function openTransferSheet(sku, fromFacility) {
  const from = normFacility(fromFacility);
  if (!from) return;
  const item = SY.itemBySku(sku);
  const b = await SY.projectedFor(from, sku);
  const maxGood = b.good;
  if (maxGood <= 0) { toast(`No good stock at ${from} to move.`, 'error'); return; }
  const canPick = activeFacilities().filter(f => f.facility !== from).length > 0;
  if (!canPick) { toast('Add a second warehouse to move stock between them.', 'error'); return; }

  let toFac = '';

  openSheet({
    title: 'Move stock',
    body: `
      <p style="font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--s-3)">
        ${esc(sku)} · ${esc(item?.description || '')}</p>
      <div class="note-info">
        This does <b>NOT</b> change your total stock.<br>
        It moves <b>good</b> stock from one warehouse to another.
        Damaged stock cannot be moved.
      </div>
      <div class="field">
        <span class="field-label eyebrow">From</span>
        <div class="item-select" style="background:var(--disabled-bg)">
          <span class="row-main">

            <span class="row-desc">✓ ${n(maxGood)} good available to move</span>
          </span>
        </div>
      </div>
      <div class="field">
        <span class="field-label eyebrow">To <span class="req">*</span></span>
        <!-- Chips, not the warehouse picker sheet. There is only ONE sheet, so
             opening the picker from in here would replace this form and lose
             the quantity already typed. Under ten warehouses (14.A) a wrapped
             chip row is also one tap instead of three. -->
        <div class="chips" id="trToChips"></div>
        <div class="field-error" id="trToErr"></div>
      </div>
      <div class="field">
        <label class="field-label eyebrow" for="trQty">
          How many to move? <span class="req">*</span> (${esc(item?.uom || '')})</label>
        <div class="stepper">
          <button type="button" id="trMinus" aria-label="Less">−</button>
          <input id="trQty" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"
            placeholder="0" aria-label="Quantity to move">
          <button type="button" id="trPlus" aria-label="More">+</button>
        </div>
        <div class="chips" id="trQtyChips">
          <button class="chip-add" data-tr="1">+1</button>
          <button class="chip-add" data-tr="5">+5</button>
          <button class="chip-add" data-tr="10">+10</button>
          <button class="chip-add" id="trAll">All ${n(maxGood)}</button>
        </div>
        <div class="field-help">Max ${n(maxGood)} good at ${esc(from)}</div>
        <div class="field-error" id="trErr"></div>
      </div>
      <div class="preview" id="trPreview" hidden></div>
      <div class="field">
        <label class="field-label eyebrow" for="trVeh">Vehicle number (optional)</label>
        <input class="field-input" id="trVeh" type="text" autocomplete="off" maxlength="20"
          autocapitalize="characters" spellcheck="false" placeholder="Truck / trailer">
      </div>
      <div class="field">
        <label class="field-label eyebrow" for="trNote">Note (optional)</label>
        <textarea class="field-input" id="trNote" rows="2" maxlength="120"
          autocapitalize="sentences"></textarea>
      </div>`,
    foot: `<button class="btn" id="trSubmit" disabled>⇄ Move stock</button>`
  });

  const repaint = async () => {
    const qty = readNum('trQty');
    const err = $('trErr');
    err.textContent = '';
    $('trQty').classList.remove('is-invalid');
    let valid = !!toFac;
    if (qty === null) valid = false;
    else if (qty < 1) { err.textContent = 'Quantity must be at least 1.'; valid = false; }
    else if (qty > maxGood) {
      err.textContent = `Only ${n(maxGood)} good ${item?.uom || 'units'} at ${from}. `
        + `You can't move more than that.`;
      $('trQty').classList.add('is-invalid');
      valid = false;
    }

        <div class="line"><span>${esc(from)} good ${n(b.good)} →
          <b style="color:var(--rsa-red)">${n(b.good - qty)}</b></span></div>
        <div class="line"><span>${esc(toFac)} good ${n(dest.good)} →
          <b style="color:var(--good-ink)">${n(dest.good + qty)}</b></span></div>
        <div class="line" style="margin-top:var(--s-2);color:var(--muted)">
          <span>Across both warehouses</span><span><b>unchanged</b></span></div>`;
    } else { pv.hidden = true; }

    $('trSubmit').disabled = !valid;
    $('trSubmit').textContent = (qty && qty >= 1 && toFac)
      ? `⇄ Move ${n(qty)} to ${toFac}` : '⇄ Move stock';
  };

  // Destinations: every OPEN yard except the source. A closed yard is not
  // OFFERED — unlike an entry already queued against one, this is a fresh
  // decision, and 11.A is about accepting movements that have already happened,
  // not about inviting new ones into a yard that is shut.
  //
  // "Not offered" is all this claims. A yard closed on another phone while this
  // form is open stays selected and the move still posts, because that is what
  // 11.A requires — the server accepts it and flags it in the row's remarks.
  const paintToChips = () => {
    $('trToChips').innerHTML = activeFacilities()
      .filter(f => f.facility !== from)
      .map(f => `<button type="button" class="chip-filter" data-to="${esc(f.facility)}"
        aria-pressed="${String(f.facility === toFac)}">${esc(f.facility)}</button>`).join('');
    for (const c of $('trToChips').querySelectorAll('[data-to]')) {
      c.onclick = () => { toFac = normFacility(c.dataset.to); paintToChips(); repaint(); };
    }
  };

  const bump = by => {
    const cur = readNum('trQty') ?? 0;
    $('trQty').value = String(Math.max(0, Math.min(maxGood, cur + by)));
    repaint();
  };
  $('trMinus').onclick = () => bump(-1);
  $('trPlus').onclick = () => bump(1);
  $('trAll').onclick = () => { $('trQty').value = String(maxGood); repaint(); };
  // Scoped to the container, not `document`. It is only safe over the whole
  // document because there is exactly one sheet — an invariant this change
  // already leans on hard enough elsewhere.
  for (const c of $('trQtyChips').querySelectorAll('[data-tr]')) {
    c.onclick = () => bump(parseInt(c.dataset.tr, 10));
  }
  $('trQty').addEventListener('input', e => {
    const clean = e.target.value.replace(/[^\d]/g, '').slice(0, 6);
    if (clean !== e.target.value) e.target.value = clean;
    repaint();
  });
  $('trVeh').oninput = e => {
    const pos = e.target.selectionStart;
    e.target.value = e.target.value.toUpperCase();
    try { e.target.setSelectionRange(pos, pos); } catch { /* not selectable */ }
  };
  paintToChips();

  $('trSubmit').onclick = () => {
    const qty = readNum('trQty');
    if (!qty || qty < 1 || qty > maxGood || !toFac || toFac === from) return;
    // Read the free-text fields NOW. confirmSheet replaces this sheet's body,
    // so by the time onConfirm runs these inputs no longer exist and the
    // vehicle number and note would be silently dropped.
    const vehicleNo = $('trVeh').value.trim().toUpperCase();
    const remarks = $('trNote').value.trim();
    confirmSheet({
      title: 'Move this stock?',
      message: `<b>${n(qty)} ${esc(item?.uom || '')}</b> of ${esc(sku)}<br>
        from <b>${esc(from)}</b> to <b>${esc(toFac)}</b>.<br><br>
        Your total across both warehouses does not change.`,
      confirmLabel: 'Yes, move it',
      onConfirm: async () => {
        // Same re-check as the damage sheet, and for the same reason: maxGood
        // is from sheet-open time and confirmSheet adds another dwell. Both
        // ends are re-validated against the warehouse list too — either could
        // have been removed while this form was open.
        const src = knownFacility(from);
        const dst = knownFacility(toFac);
        const now = src ? await SY.projectedFor(src, sku) : { good: 0 };
        if (!src || !dst || src === dst || qty > now.good) {
          closeSheet();
          toast(src && dst
            ? `Only ${n(now.good)} good left at ${src} now — nothing moved.`
            : 'One of those warehouses is no longer in the list — nothing moved.', 'error');
          await render();
          return;
        }
        const { settled } = await OB.enqueue({
          type: 'TRANSFER', sku, facility: src, toFacility: dst,
          payload: { qty, condition: 'GOOD', vehicleNo, remarks },
          recordedBy: prefs.getUser()
        });
        if (vehicleNo) prefs.pushRecentVehicle(vehicleNo);
        buzz();
        toast(`Moved ${n(qty)} ${item?.uom || ''} of ${sku} from ${from} to ${toFac}.`);
        await render();
        settleInBackground(settled);
        warnOfflineOnce();
      }
    });
  };
  await repaint();
}

/* ================= S7 opening stock, per warehouse ================= */

/**
 * @param {string} sku
 * @param {string} facility  REQUIRED
 *
 * Opening stock is a physical count, and 12.A makes it a once-per-(warehouse,
 * SKU) entry rather than once per SKU. The item form only ever offers it for
 * the FIRST warehouse, at the moment the item is created — so without this
 * sheet a yard that starts holding an existing item has no way to record what
 * is standing in it, and the count has to be entered as a Receive, writing an
 * INBOUND row for a delivery that never happened.
 *
 * S04's deliverable is Harish entering opening stock per warehouse. This is the
 * screen that lets him.
 *
 * Offered only where nothing is recorded yet at this yard, and re-checked at
 * confirm. Both checks are the app's own: the server's `opening_done` flag
 * catches a SECOND opening (OPENING_EXISTS) but nothing else, because the flag
 * is set only by an OPENING — a key that merely has a receipt against it is
 * still "opening not done" there, and an opening on top of it would commit and
 * double the yard's stock.
 */
async function openOpeningSheet(sku, facility) {
  const fac = knownFacility(facility);
  if (!fac) return;
  const item = SY.itemBySku(sku);

  openSheet({
    title: 'Opening stock',
    body: `
      <p style="font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--s-3)">
        ${esc(sku)} · ${esc(item?.description || '')}</p>
      <div class="fac-note">🏗 <span>Counting what is standing at <b>${esc(fac)}</b> right now.</span></div>
      <div class="note-info">
        Use this <b>once per warehouse</b>, for the first count. After that use
        <b>Receive</b>, <b>Issue</b> and <b>Record damage</b> so the history stays true.
      </div>
      <!-- These two ADD UP: the entry sent is qty = good + damaged. The label
           "Damaged (of which)" was used here first and is wrong — "of which"
           says damaged is a subset of the number above it, so a count of
           "100 units, 20 of them damaged" gets typed as 100 and 20 and posts an
           opening TOTAL of 120. On a once-per-warehouse entry in an
           append-only ledger, that overstatement is permanent short of a void. -->
      <div class="field">
        <label class="field-label eyebrow" for="opGood">Good — undamaged (${esc(item?.uom || '')})</label>
        <div class="stepper">
          <button type="button" id="opGoodMinus" aria-label="Less">−</button>
          <input id="opGood" type="text" inputmode="numeric" pattern="[0-9]*" value="0"
            aria-label="Good quantity">
          <button type="button" id="opGoodPlus" aria-label="More">+</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label eyebrow" for="opDmg">Damaged — as well as the good</label>
        <div class="stepper">
          <button type="button" id="opDmgMinus" aria-label="Less">−</button>
          <input id="opDmg" type="text" inputmode="numeric" pattern="[0-9]*" value="0"
            aria-label="Damaged quantity">
          <button type="button" id="opDmgPlus" aria-label="More">+</button>
        </div>
        <div class="field-help">The opening total is good + damaged.</div>
        <div class="field-error" id="opErr"></div>
      </div>
      <div class="preview" id="opPreview" hidden></div>`,
    foot: `<button class="btn" id="opSubmit" disabled>Record opening stock</button>`
  });

  const read = id => parseInt(($(id).value || '0').replace(/[^\d]/g, ''), 10) || 0;
  const repaint = () => {
    const g = read('opGood');
    const d = read('opDmg');
    const pv = $('opPreview');
    if (g + d > 0) {
      pv.hidden = false;
      pv.innerHTML = `<div class="line"><span>Opening total <b>${n(g + d)}</b> at <b>${esc(fac)}</b></span>
        <span>= <b style="color:var(--good-ink)">${n(g)} good</b> + <b style="color:var(--rsa-red)">${n(d)} damaged</b></span></div>
        ${stockBar(g + d, d)}`;
    } else { pv.hidden = true; }
    $('opSubmit').disabled = !(g + d > 0);
    $('opSubmit').textContent = g + d > 0
      ? `Record ${n(g + d)} at ${fac}` : 'Record opening stock';
  };

  const bump = (id, by) => {
    $(id).value = String(Math.max(0, Math.min(999999, read(id) + by)));
    repaint();
  };
  $('opGoodMinus').onclick = () => bump('opGood', -1);
  $('opGoodPlus').onclick = () => bump('opGood', 1);
  $('opDmgMinus').onclick = () => bump('opDmg', -1);
  $('opDmgPlus').onclick = () => bump('opDmg', 1);
  for (const id of ['opGood', 'opDmg']) {
    $(id).addEventListener('input', e => {
      e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 6);
      repaint();
    });
  }

  $('opSubmit').onclick = () => {
    const g = read('opGood');
    const d = read('opDmg');
    if (g + d <= 0) return;
    confirmSheet({
      title: 'Record opening stock?',
      message: `<b>${n(g + d)} ${esc(item?.uom || '')}</b> of ${esc(sku)} at <b>${esc(fac)}</b>
        — ${n(g)} good, ${n(d)} damaged.<br><br>
        This is the first count for this warehouse and can only be done once.`,
      confirmLabel: 'Yes, record it',
      onConfirm: async () => {
        const nowFac = knownFacility(fac);
        // Re-read the yard, exactly as the damage and move sheets do. The
        // "nothing here yet" precondition was tested when this sheet opened and
        // confirmSheet has added a dwell since; a receipt from another phone, or
        // one of this phone's own queued entries flushing, lands inside it.
        //
        // The server will NOT catch this. `opening_done` is set only by an
        // OPENING, so a key that merely has a receipt against it is still
        // "opening not done" and the OPENING commits ON TOP — doubling the
        // stock at that yard, permanently, in an append-only ledger.
        const now = nowFac ? await SY.projectedFor(nowFac, sku) : null;
        if (!nowFac || now.total !== 0 || now.damaged !== 0 || now.pending) {
          closeSheet();
          toast(nowFac
            ? `${sku} already has stock at ${nowFac} — opening stock not recorded.`
            : `Warehouse "${fac}" is not in the warehouse list.`, 'error');
          await render();
          return;
        }
        // qty is the TOTAL and damagedQty the subset of it — the same shape the
        // item form sends, and what deltasFor expects for OPENING.
        const { settled } = await OB.enqueue({
          type: 'OPENING', sku, facility: nowFac,
          payload: { qty: g + d, damagedQty: d, remarks: 'Opening stock' },
          recordedBy: prefs.getUser()
        });
        buzz();
        toast(`Opening stock of ${n(g + d)} recorded at ${nowFac}.`);
        await render();
        settleInBackground(settled);
        warnOfflineOnce();
      }
    });
  };
  repaint();
}

function renderItems() {
  const q = ui.itemSearch.trim();
  const all = SY.state.items.filter(i => matches(i, q));
  $('itemCount').textContent = SY.state.items.length
    ? (q ? `${all.length} of ${SY.state.items.length} match “${q}”` : `${SY.state.items.length} items`)
    : '';

  const list = $('itemList');
  if (!SY.state.items.length) {
    list.innerHTML = `<div class="empty"><span class="g">📦</span><h3>No items yet</h3>
      <p>Add your first SKU to start tracking yard stock.</p>

      <button class="btn btn-ghost" id="emAdd2">+ Add “${esc(q.toUpperCase())}” as a new item</button></div>`;
    $('emAdd2').onclick = () => openItemForm(null, q.toUpperCase());

        <span class="row-desc">${esc(i.description)}</span>
      </span>
      <span class="chip chip-neutral">${esc(i.uom)}</span>
      <span class="chev">›</span>

    b.onclick = () => openItemForm(b.dataset.item);

$('itemSearch').oninput = e => { ui.itemSearch = e.target.value; renderItems(); };
$('itemClear').onclick = () => { ui.itemSearch = ''; $('itemSearch').value = ''; renderItems(); };
$('fabAddItem').onclick = () => openItemForm();

async function openItemForm(existingSku, prefillSku) {
  const item = existingSku ? SY.itemBySku(existingSku) : null;
  // Opening stock is recorded at ONE warehouse. Not pre-filled (6.B) — a
  // physical count belongs to the yard it was counted in, and inheriting
  // whichever yard the stock screen was showing is exactly how it would end up
  // filed against the wrong one.
  let ifFacility = '';

  openSheet({
    title: item ? 'Edit item' : 'Add item',
    body: `
      <div class="field">
        <label class="field-label eyebrow" for="ifSku">SKU code <span class="req">*</span></label>
        <input class="field-input" id="ifSku" type="text" autocapitalize="characters"
          autocomplete="off" spellcheck="false" maxlength="24" enterkeyhint="next"
          value="${esc(item?.sku || prefillSku || '')}" ${item ? 'readonly' : ''}>
        ${item ? '<div class="field-help">SKU code can’t be changed — the stock history is keyed to it.</div>' : ''}
        <div class="field-error" id="ifSkuErr"></div>
      </div>
      <div class="field">
        <label class="field-label eyebrow" for="ifDesc">Description <span class="req">*</span></label>
        <input class="field-input" id="ifDesc" type="text" autocapitalize="sentences"
          maxlength="80" enterkeyhint="done" value="${esc(item?.description || '')}">
        <div class="field-error" id="ifDescErr"></div>
      </div>
      <div class="field">
        <span class="field-label eyebrow">Unit</span>
        <div class="chips" id="ifUoms">
          ${SY.state.uoms.map(u => `<button class="chip-filter" data-uom="${u}"
            aria-pressed="${String(u === (item?.uom || 'PCS'))}">${u}</button>`).join('')}
        </div>
      </div>
      ${item ? '' : `
      <div class="eyebrow" style="margin:var(--s-5) 0 var(--s-2)">Opening stock</div>
      <div class="field">
        <span class="field-label eyebrow">Warehouse
          <span class="req" id="ifFacReq" hidden>*</span></span>
        <!-- Chips rather than the picker sheet: this form IS a sheet, and there
             is only one, so opening the picker over it would throw away the SKU
             and description already typed. -->
        <div class="chips" id="ifFacChips"></div>
        <div class="field-help">Only needed if you are entering an opening quantity below.</div>
        <div class="field-error" id="ifFacErr"></div>
      </div>
      <!-- Additive, same as the opening sheet — see the note there. -->
      <div class="field">
        <label class="field-label eyebrow" for="ifGood">Good — undamaged</label>
        <div class="stepper">
          <button type="button" id="ifGoodMinus">−</button>
          <input id="ifGood" type="text" inputmode="numeric" pattern="[0-9]*" value="0">
          <button type="button" id="ifGoodPlus">+</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label eyebrow" for="ifDmg">Damaged — as well as the good</label>
        <div class="stepper">
          <button type="button" id="ifDmgMinus">−</button>
          <input id="ifDmg" type="text" inputmode="numeric" pattern="[0-9]*" value="0">
          <button type="button" id="ifDmgPlus">+</button>
        </div>
        <div class="field-help">The opening total is good + damaged.</div>
      </div>
      <div class="preview" id="ifPreview" hidden></div>`}
      ${item ? `<div class="note-info" style="margin-top:var(--s-4)">
        To set this item's opening stock at another warehouse, open it from the
        stock screen, choose the warehouse, and tap <b>Opening stock</b>.</div>` : ''}`,
    foot: `<button class="btn" id="ifSave" disabled>Save item</button>`
  });

  let uom = item?.uom || 'PCS';
  for (const b of $('ifUoms').querySelectorAll('[data-uom]')) {
    b.onclick = () => {
      uom = b.dataset.uom;
      for (const o of $('ifUoms').querySelectorAll('[data-uom]')) {
        o.setAttribute('aria-pressed', String(o === b));
      }
    };
  }

  const stepOpening = (id, by) => {
    const cur = parseInt(($(id).value || '0').replace(/[^\d]/g, ''), 10) || 0;
    $(id).value = String(Math.max(0, Math.min(999999, cur + by)));
    validate();
  };
  const paintIfFacChips = () => {
    const box = $('ifFacChips');
    if (!box) return;
    const open = activeFacilities();
    box.innerHTML = open.length
      ? open.map(f => `<button type="button" class="chip-filter" data-iffac="${esc(f.facility)}"
          aria-pressed="${String(f.facility === ifFacility)}">${esc(f.facility)}</button>`).join('')
      : '<span class="field-help">No warehouses yet — add one first.</span>';
    for (const c of box.querySelectorAll('[data-iffac]')) {
      c.onclick = () => { ifFacility = normFacility(c.dataset.iffac); paintIfFacChips(); validate(); };
    }
  };

  if (!item) {
    paintIfFacChips();
    $('ifGoodMinus').onclick = () => stepOpening('ifGood', -1);
    $('ifGoodPlus').onclick = () => stepOpening('ifGood', 1);
    $('ifDmgMinus').onclick = () => stepOpening('ifDmg', -1);
    $('ifDmgPlus').onclick = () => stepOpening('ifDmg', 1);
    for (const id of ['ifGood','ifDmg']) {
      $(id).addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 6);
        validate();
      });
    }
  }

  function validate() {
    const sku = ($('ifSku').value || '').trim().toUpperCase();
    const desc = ($('ifDesc').value || '').trim();
    const se = $('ifSkuErr'), de = $('ifDescErr');
    se.textContent = ''; de.textContent = '';
    $('ifSku').classList.remove('is-invalid');
    $('ifDesc').classList.remove('is-invalid');
    let ok = true;

    if (!sku) ok = false;
    else if (sku.length < 2) { se.textContent = 'SKU code must be at least 2 characters.'; ok = false; }
    else if (!/^[A-Z0-9][A-Z0-9\-_.\/]*$/.test(sku)) {
      se.textContent = 'Use only letters, numbers and dashes.';
      $('ifSku').classList.add('is-invalid'); ok = false;
    } else if (!item && SY.state.items.some(i => i.sku === sku)) {
      se.textContent = `SKU ${sku} already exists.`;
      $('ifSku').classList.add('is-invalid'); ok = false;
    }
    if (!desc) ok = false;
    else if (desc.length < 3) { de.textContent = 'Description must be at least 3 characters.'; ok = false; }

    if (!item) {
      const g = parseInt(($('ifGood').value || '0').replace(/[^\d]/g, ''), 10) || 0;
      const d = parseInt(($('ifDmg').value || '0').replace(/[^\d]/g, ''), 10) || 0;
      const pv = $('ifPreview');
      // The warehouse only becomes required once there is an opening quantity
      // to put somewhere. Saving a catalogue entry with no stock needs no yard.
      $('ifFacReq').hidden = !(g + d > 0);
      const fe = $('ifFacErr');
      if (g + d > 0 && !ifFacility) {
        fe.textContent = 'Choose the warehouse this opening stock is in.';
        ok = false;
      } else { fe.textContent = ''; }
      if (g + d > 0) {
        pv.hidden = false;
        pv.innerHTML = `<div class="line"><span>Opening total <b>${n(g + d)}</b>${ifFacility ? ` at <b>${esc(ifFacility)}</b>` : ''}</span>
          <span>= <b style="color:var(--good-ink)">${n(g)} good</b> + <b style="color:var(--rsa-red)">${n(d)} damaged</b></span></div>
          ${stockBar(g + d, d)}`;
      } else { pv.hidden = true; }
    }
    $('ifSave').disabled = !ok;
  }
  $('ifSku').addEventListener('input', validate);
  $('ifDesc').addEventListener('input', validate);
  validate();

  $('ifSave').onclick = async () => {
    const btn = $('ifSave');
    const sku = ($('ifSku').value || '').trim().toUpperCase();
    const description = ($('ifDesc').value || '').trim();
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Saving…';

    try {
      await apiPost('upsertItem', {
        sku, description, uom, recordedBy: prefs.getUser(),
        rev: item ? item.rev : undefined
      });

      // Opening stock goes in as an OPENING ledger entry, not as an item field,
      // so it folds like every other movement.
      if (!item) {
        const g = parseInt(($('ifGood').value || '0').replace(/[^\d]/g, ''), 10) || 0;
        const d = parseInt(($('ifDmg').value || '0').replace(/[^\d]/g, ''), 10) || 0;
        // knownFacility here too — the sixth enqueue path. These chips are
        // painted once and never repainted, so a facilities refresh landing
        // while this form is open is exactly the window it closes.
        const openFac = knownFacility(ifFacility);
        if (g + d > 0 && openFac) {
          const { settled } = await OB.enqueue({
            type: 'OPENING', sku, facility: openFac,
            payload: { qty: g + d, damagedQty: d, remarks: 'Opening stock' },
            recordedBy: prefs.getUser()
          });
          settleInBackground(settled);
        }
      }
      await SY.refreshItems();
      closeSheet();
      toast(`Item ${sku} saved.`);
      await render();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Save item';
      if (err instanceof ApiError && err.code === 'SKU_EXISTS') {
        $('ifSkuErr').textContent = `SKU ${sku} already exists.`;
        $('ifSku').classList.add('is-invalid');
      }
      toast(err.message || 'Could not save the item.', 'error');
    }
  };
}

/* ================= failures sheet ================= */

/**
 * X13 — the residual risk of transfers, stated rather than silently accepted.
 *
 * The fold is commutative; VALIDATION is not. An offline transfer A→B that
 * arrives after another phone has already issued that stock from B is refused
 * at B, because the server believes B holds nothing. That used to need someone
 * to issue before a receipt uploaded; with transfers it is routine, since the
 * destination legitimately holds physical stock the server has not heard about.
 *
 * The server already says this on the TRANSFER rejection itself, so the hint is
 * not repeated when the message already carries it.
 */
const SHORTFALL_CODES = ['INSUFFICIENT_GOOD_STOCK', 'INSUFFICIENT_DAMAGED_STOCK',
  'DAMAGE_EXCEEDS_GOOD', 'REPAIR_EXCEEDS_DAMAGED', 'WOULD_GO_NEGATIVE'];

function rejectionHint(f) {
  const code = f.error?.code || '';
  const msg = String(f.error?.message || '');
  if (!SHORTFALL_CODES.includes(code)) return '';
  if (/pending uploads/i.test(msg)) return '';
  return 'A move of this item into that warehouse may not have uploaded yet — '
    + 'check pending uploads before discarding this.';
}

$('failBanner').onclick = async () => {
  const failed = await OB.failedItems();
  openSheet({
    title: 'Could not be saved',
    body: failed.length ? failed.map(f => `
      <div class="row" style="flex-direction:column;align-items:stretch;gap:var(--s-2)">
        <div style="display:flex;gap:var(--s-2);align-items:center">
          <span class="row-main">
            <span class="row-sku">${esc(f.type)} · ${esc(f.sku)}</span>
            <span class="row-desc">${f.type === 'TRANSFER'
                ? `${esc(f.facility || '?')} → ${esc(f.toFacility || '?')}`
                : esc(f.facility || 'no warehouse')} · ${n(f.payload.qty)}${f.payload.damagedQty ? ` (${n(f.payload.damagedQty)} dmg)` : ''} · ${when(f.clientTs)}</span>
          </span>
        </div>
        <div style="font-size:var(--fs-sm);color:var(--rsa-red);font-weight:var(--fw-6)">
          ${esc(f.error?.message || 'Rejected')}</div>
        ${rejectionHint(f)
          ? `<div style="font-size:var(--fs-sm);color:var(--sea)">${esc(rejectionHint(f))}</div>`
          : ''}
        <div class="btn-row">
          <button class="btn btn-ghost" data-retry="${f.seq}">Try again</button>
          <button class="btn btn-danger" data-discard="${f.seq}">Discard</button>
        </div>
      </div>`).join('')
      : `<div class="empty"><span class="g">✅</span><h3>Everything is uploaded</h3>
         <p>Nothing is waiting on this phone.</p></div>`
  });
  for (const b of document.querySelectorAll('[data-retry]')) {
    b.onclick = async () => {
      await OB.retryFailed(parseInt(b.dataset.retry, 10));
      closeSheet();
      toast('Sent again.', 'info');
      await render();
    };
  }
  for (const b of document.querySelectorAll('[data-discard]')) {
    b.onclick = () => {
      const seq = parseInt(b.dataset.discard, 10);
      confirmSheet({
        title: 'Discard this entry?',
        message: 'This entry will be deleted and never uploaded. This cannot be undone.',
        confirmLabel: 'Discard', danger: true,
        onConfirm: async () => { await OB.discardFailed(seq); await render(); }
      });
    };
  }
};

/* ================= sync sheet ================= */
$('syncPill').onclick = async () => {
  const queue = await OB.pendingItems();
  openSheet({
    title: 'Pending uploads',
    body: queue.length ? `
      <p style="font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--s-3)">
        ${queue.length} ${queue.length === 1 ? 'entry' : 'entries'} saved on this phone, waiting to upload.</p>
      ${queue.map(q => `<div class="mv">
        <span class="t"><b>${esc(q.type)}</b> ${esc(q.sku)}
          <span class="when">${q.type === 'TRANSFER'
              ? `${esc(q.facility || '?')} → ${esc(q.toFacility || '?')}`
              : esc(q.facility || 'no warehouse')} · ${when(q.clientTs)} · ${esc(q.recordedBy)}</span>
          ${q.lastError ? `<span class="when" style="color:var(--rsa-red)">${esc(q.lastError.message)}</span>` : ''}
        </span>
        <span class="q">${n(q.payload.qty)}</span>
        <span class="pending-tag">${q.status === 'stuck' ? '⚠' : '⟳'}</span>
      </div>`).join('')}`
      : `<div class="empty"><span class="g">✅</span><h3>Everything is uploaded</h3>
         <p>Nothing is waiting on this phone.</p></div>`,
    foot: `<button class="btn" id="syncNow">Try to upload now</button>`
  });
  $('syncNow').onclick = async () => { closeSheet(); await doRefresh(); };
};

/* ================= sync driving ================= */
let warnedOffline = false;
async function warnOfflineOnce() {
  if (warnedOffline) return;
  const pending = await OB.pendingCount();
  if (!SY.state.online && pending > 0) {
    warnedOffline = true;
    toast("Saved on this phone. It will upload when you're back online.", 'warn');
  }
}

async function doRefresh() {
  const res = await SY.manualRefresh();
  await render();
  if (res.ok) {
    const pending = await OB.pendingCount();
    toast(pending ? `${pending} still waiting to upload.` : 'Everything is up to date.',
      pending ? 'info' : 'success');
  } else {
    toast(res.error?.message || 'Could not reach the server.', 'error');
  }
}

OB.onChange(() => { renderSync(); });

async function checkOnline() {
  const was = SY.state.online;
  SY.state.online = navigator.onLine && await probe();
  if (SY.state.online) warnedOffline = false;
  if (was !== SY.state.online) {
    await renderSync();
    if (SY.state.online) {
      const summary = await OB.flush();
      if (summary.balances.length) await SY.mergeBalances(summary.balances);
      if (summary.applied) toast(`${summary.applied} uploaded.`, 'success');
      await render();
    }
  }
}

window.addEventListener('online', () => { checkOnline(); });
window.addEventListener('offline', () => { SY.state.online = false; renderSync(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    OB.flush().then(async s => {
      if (s.balances.length) await SY.mergeBalances(s.balances);
      await render();
    }).catch(() => {});
  }
});
/**
 * Background sync tick.
 *
 * The read is OUTSIDE the "anything pending?" check, deliberately. It used to
 * be inside, and that meant two things were broken at once:
 *
 *  - after a save the queue is empty, so the tick did nothing at all and the
 *    screen kept the pre-save figure until the app was restarted; and
 *  - a phone never learned about ANOTHER phone's entries, so two people working
 *    the same yard each saw their own private stock figure.
 *
 * `getBalances` carries our epoch and the server answers "unchanged" when
 * nothing has been written, so a quiet tick is cheap on the wire.
 *
 * 60s not 30s, and skipped while the app is in the background: every tick costs
 * the server real Sheet reads, and they all contend for one script lock.
 */
setInterval(async () => {
  if (!SY.state.online) return;
  if (typeof document !== 'undefined' && document.hidden) return;
  try {
    if (await OB.pendingCount() > 0) {
      const s = await OB.flush();
      if (s.balances.length) await SY.mergeBalances(s.balances);
    }
    await SY.refreshBalances();
    await render();
  } catch { /* offline or a slow reply — the next tick tries again */ }
}, 60000);

/* ================= boot ================= */
async function init() {
  const msg = $('bootMsg');
  try {
    msg.textContent = 'Loading saved data…';
    await SY.loadFromCache();
    if (SY.state.users.length) ui.usersLoaded = true;
    await OB.recoverInFlight();
    paintUser();

    msg.textContent = 'Checking connection…';
    SY.state.online = navigator.onLine;

    // Show the UI from cache immediately — never block the yard on the network.
    clearTimeout(bootWatchdog);
    $('boot').hidden = true;
    show(prefs.getUser() ? 'balance' : 'name');

    try {
      await SY.bootstrap();
      SY.state.online = true;
      ui.usersLoaded = true;
    } catch (err) {
      ui.usersLoaded = true;   // done trying; the cache is all we have
      SY.state.online = false;
      if (err instanceof ApiError && err.code === 'NEEDS_AUTH') {
        toast(err.message, 'error');
      } else if (!SY.state.items.length) {
        toast('Working offline — showing what was saved on this phone.', 'warn');
      }
    }
    if (!prefs.getUser()) show('name');
    await render();

    const s = await OB.flush();
    if (s.balances.length) await SY.mergeBalances(s.balances);
    await render();
  } catch (err) {
    clearTimeout(bootWatchdog);
    $('boot').hidden = true;
    show(prefs.getUser() ? 'balance' : 'name');
    toast('Something went wrong starting up. Pull down to retry.', 'error');
    console.error(err);
  }
}

// Whatever happens, the splash screen must not be where the user ends up.
// If we are still on it after 12 seconds, force the app open and say why.
const bootWatchdog = setTimeout(() => {
  const boot = $('boot');
  if (boot && !boot.hidden) {
    boot.hidden = true;
    show(prefs.getUser() ? 'balance' : 'name');
    toast('Started up without a connection. Pull down to refresh once you have signal.', 'warn');
  }
}, 12000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

init();
</script>
